<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Paqueterías · The Carriers</title>
<link rel="icon" href="../assets/brand/mark-white.svg">
<link rel="stylesheet" href="../assets/app.css?v=a44065df">
<script src="../assets/vigia.js?v=a44065df" defer></script>
</head>
<body data-seccion="paqueterias">
<main class="contenido contenido--ancho">

  <div class="encabezado" style="margin-bottom:24px">
    <div>
      <h1>Paqueterías</h1>
      <p>Las cuentas por las que se compran las guías. Con qué paquetería sale
         cada pedido se decide en Configuración.</p>
    </div>
  </div>

  <p class="guardado" id="guardado" role="status" aria-live="polite" hidden></p>

  <div class="fichas fichas--conexiones" id="cuentas"></div>

  <section class="zona zona--analitica" style="margin-top:26px">
    <h2 class="zona__titulo">Se pueden conectar</h2>
    <p class="apagado" style="font-size:13px;margin-bottom:12px">
      Estas plataformas revenden las guías de DHL, FedEx y las demás. No son
      paqueterías: son por dónde se compran.</p>
    <div class="fichas fichas--conexiones" id="otras"></div>
  </section>

</main>

<script type="module">
import { montar, exigirSesion } from "../assets/app.js?v=a44065df";
import { cuentasEnvio, PLATAFORMAS, conexionesCaidas } from "../assets/datos.js?v=a44065df";
if (exigirSesion()) {
  montar();

  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  const aviso = document.getElementById("guardado");
  let quitando;
  function avisar(texto) {
    clearTimeout(quitando);
    aviso.textContent = texto;
    aviso.hidden = false;
    quitando = setTimeout(() => { aviso.hidden = true; }, 3500);
  }

  /* ---------- La cuenta por la que se compran las guías ----------
     T1 Envíos no es una paquetería: es quien revende las guías de todas. Por
     eso va arriba y aparte, y no dentro de la lista de preferencia. */
  const caidas = conexionesCaidas().map((c) => c.id);

  document.getElementById("cuentas").innerHTML = cuentasEnvio.map((c) => {
    const rota = caidas.includes(c.id);
    return `
    <article class="ficha">
      <div class="ficha__cabeza">
        <div>
          <h2>${esc(c.nombre)}</h2>
          <p class="ficha__sub">${esc(c.detalle)}</p>
        </div>
        <span class="pastilla pastilla--${rota ? "aviso" : "ok"}">${
          rota ? "Sin sincronizar" : "Conectada"}</span>
      </div>
      <p class="ficha__nota">${esc(c.que)}</p>
      <p class="ficha__nota">${esc(c.desde)}</p>

      <details class="avanzado avanzado--ficha">
        <summary>Credenciales</summary>
        <div class="campos">
          ${c.campos.map((f) => `
            <label class="campo"><span>${esc(f.et)}</span>
              <input value="${esc(f.valor)}" readonly></label>`).join("")}
        </div>
      </details>

      <div class="ficha__pie">
        <button class="boton boton--sutil boton--chico" type="button">Revisar conexión</button>
      </div>
    </article>`;
  }).join("");

  /* Las que faltan se ven como tarjetas apagadas, igual que en Canales de
     venta: así se distingue de un vistazo lo conectado de lo conectable. */
  document.getElementById("otras").innerHTML = PLATAFORMAS
    .filter((p) => !cuentasEnvio.some((c) => c.nombre === p))
    .map((n) => `
      <article class="ficha ficha--apagada">
        <div class="ficha__cabeza">
          <div><h2>${esc(n)}</h2></div>
          <span class="pastilla">Sin conectar</span>
        </div>
        <div class="ficha__pie">
          <button class="boton boton--sutil boton--chico" type="button"
            data-conectar="${esc(n)}">Conectar</button>
        </div>
      </article>`).join("");

  document.getElementById("otras").addEventListener("click", (e) => {
    const b = e.target.closest("[data-conectar]");
    if (b) avisar(`Aquí se abriría el permiso de ${b.dataset.conectar}.`);
  });

}
</script>
</body>
</html>
