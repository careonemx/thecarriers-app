<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Correcciones · The Carriers</title>
<link rel="icon" href="../assets/brand/mark-white.svg">
<link rel="stylesheet" href="../assets/app.css?v=a44065df">
<script src="../assets/vigia.js?v=a44065df" defer></script>
</head>
<body data-seccion="correcciones">
<main class="contenido contenido--ancho">

  <div class="encabezado">
    <div>
      <h1>Correcciones</h1>
      <p>Qué se cambió de cada dirección antes de pedir la guía, y con qué se decidió.
         Las que todavía no se resuelven están en Pedidos, junto a su pedido.</p>
    </div>
  </div>

  <div class="rejilla rejilla--3" style="margin-bottom:16px" id="metricas"></div>

  <section class="tarjeta">
    <div class="filtros">
      <div class="buscador">
        <label class="sr-only" for="q-corr">Buscar en el historial</label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q-corr" autocomplete="off"
               placeholder="Filtrar por pedido, destinatario o código postal">
      </div>

      <span class="filtros__div" aria-hidden="true"></span>
      <button class="ficha-filtro" type="button" aria-pressed="false" id="f-tarde">
        Solo las que salieron con la anterior</button>
      <span class="filtros__sep"></span>
      <label class="sr-only" for="f-quien">Filtrar por quién lo decidió</label>
      <select id="f-quien"><option value="">Todos los orígenes</option></select>
      <label class="sr-only" for="f-campo">Filtrar por campo</label>
      <select id="f-campo"><option value="">Todos los campos</option></select>

      <span class="filtros__sep"></span>
      <!-- Las dos fechas son un rango, no dos filtros: si la barra se parte,
           se parten juntas o queda un "desde" sin su "hasta". -->
      <div class="rango-fechas">
        <label class="campo-fecha"><span class="sr-only">Desde</span>
          <input type="date" id="f-desde"></label>
        <span class="apagado" style="font-size:12px">al</span>
        <label class="campo-fecha"><span class="sr-only">Hasta</span>
          <input type="date" id="f-hasta"></label>
      </div>
    </div>

    <div class="tabla-caja scroll-fino">
      <table id="tabla-corr">
        <caption class="sr-only">Correcciones aplicadas, de la más reciente a la más antigua.</caption>
        <thead><tr>
          <th scope="col">Pedido</th>
          <th scope="col">Qué se cambió</th>
          <th scope="col">Quién lo decidió</th>
          <th scope="col">La guía</th>
          <th scope="col">Cuándo</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="pie"></div>
  </section>

</main>

<script type="module">
import { montar, exigirSesion } from "../assets/app.js?v=a44065df";
import { correccionesHechas, QUIEN_CORRIGIO, quienCorrigio,
         CAMPO_DIRECCION, fechaLarga } from "../assets/datos.js?v=a44065df";
if (exigirSesion()) {
  montar();

  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  const sinAcento = (x) => x.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;

  let pagina = 1;
  let porPagina = 25;

  /* ---------- Las cifras ----------
     Esta pantalla no se abre para trabajar, se abre para dos preguntas: si
     alguien reclama, qué se cambió en ese pedido; y si la IA está inventando
     colonias, cuántas lleva. La segunda es la que hay que poder ver sin
     buscarla, y por eso es una cifra y no una fila más de la tabla. */
  function pintarMetricas() {
    const todas = correccionesHechas();
    const porPersona = todas.filter((c) => quienCorrigio(c) === "persona").length;
    const porCatalogo = todas.length - porPersona;

    const cifra = (et, valor, nota) =>
      `<div class="metrica"><p class="metrica__etiqueta">${et}</p>
       <p class="metrica__valor tabular">${valor}</p>
       <p class="metrica__nota">${nota}</p></div>`;

    document.getElementById("metricas").innerHTML =
      cifra("Direcciones corregidas", todas.length, "en todo el historial") +
      cifra("Las decidió el catálogo", porCatalogo,
            "el código postal no deja lugar a duda") +
      cifra("Las decidió una persona", porPersona,
            porPersona ? "el catálogo no alcanzaba: alguien eligió" : "no ha hecho falta");
  }

  function filtradas() {
    const q = document.getElementById("q-corr").value.trim();
    const quien = document.getElementById("f-quien").value;
    const campo = document.getElementById("f-campo").value;
    const desde = document.getElementById("f-desde").value;
    const hasta = document.getElementById("f-hasta").value;
    const soloTarde = document.getElementById("f-tarde").getAttribute("aria-pressed") === "true";

    return correccionesHechas().filter((c) => {
      if (q && !sinAcento(`${c.folio} ${c.cliente} ${c.llego} ${c.quedo} ${c.cp}`).includes(sinAcento(q))) return false;
      if (quien && quienCorrigio(c) !== quien) return false;
      if (campo && c.campo !== campo) return false;
      if (desde && c.fecha < desde) return false;
      if (hasta && c.fecha > hasta) return false;
      if (soloTarde && c.aTiempo !== false) return false;
      return true;
    });
  }

  /* Lo primero que se pregunta en una reclamación: ¿la etiqueta salió con la
     dirección buena? Si la guía se generó antes de corregir, el pedido está
     bien pero el paquete va camino de otro sitio, y eso no se ve en la
     columna de lo que se cambió. */
  function guiaHTML(c) {
    if (!c.guia) {
      return '<span class="pastilla">Sin guía todavía</span>';
    }
    const enlace = `<a class="mono" href="envio.html?guia=${esc(c.guia)}">${esc(c.guia)}</a>`;
    return c.aTiempo
      ? `<span class="pastilla pastilla--ok">Salió corregida</span>
         <span class="nota-bajo">${enlace}</span>`
      : `<span class="pastilla pastilla--mal">Salió con la anterior</span>
         <span class="nota-bajo">${enlace} · hay con qué reclamar</span>`;
  }

  function pintar() {
    const lista = filtradas();
    const paginas = Math.max(1, Math.ceil(lista.length / porPagina));
    pagina = Math.min(pagina, paginas);
    const ini = (pagina - 1) * porPagina;
    const enPagina = lista.slice(ini, ini + porPagina);

    document.querySelector("#tabla-corr tbody").innerHTML = enPagina.length
      ? enPagina.map((c) => {
          const quien = quienCorrigio(c);
          return `
          <tr>
            <th scope="row"><a class="mono"
              href="pedidos.html?pedido=${esc(c.folio.replace(/\D/g, ""))}">${esc(c.folio)}</a>
              <span class="nota-bajo">${esc(c.cliente)}</span></th>

            <td>${esc(CAMPO_DIRECCION[c.campo] ?? c.campo)}:
              <s class="caso__malo">${esc(c.llego)}</s> → <b>${esc(c.quedo)}</b>
              <span class="nota-bajo">${c.apoyo
                ? esc(c.apoyo)
                : `El CP ${esc(c.cp)} no bastaba para decidirlo.`}</span></td>

            <td><span class="pastilla${quien === "catalogo" ? " pastilla--ok" : " pastilla--aviso"}">${
              esc(QUIEN_CORRIGIO[quien])}</span></td>

            <td>${guiaHTML(c)}</td>

            <td class="tabular">${esc(fechaLarga(c.fecha))}</td>
          </tr>`;
        }).join("")
      : `<tr><td colspan="5"><p class="vacio">Con esos filtros no hay ninguna corrección.</p></td></tr>`;

    document.getElementById("pie").innerHTML = lista.length ? `
      <div class="tarjeta__pie">
        <span>Mostrando <b>${ini + 1}–${ini + enPagina.length}</b> de
          <b>${plural(lista.length, "corrección", "correcciones")}</b></span>
        <label class="filtros__etiqueta" for="por-pagina">
          <select id="por-pagina" style="width:auto;margin-left:8px">
            ${[25, 50, 100].map((n) =>
              `<option value="${n}"${n === porPagina ? " selected" : ""}>${n} por página</option>`).join("")}
          </select>
        </label>
        <span class="filtros__sep"></span>
        <div class="paginacion"${paginas === 1 ? " hidden" : ""}>
          <button type="button" data-ir="${pagina - 1}"${pagina === 1 ? " disabled" : ""}>‹</button>
          ${Array.from({ length: paginas }, (_, i) => i + 1).map((n) =>
            `<button type="button" data-ir="${n}"${n === pagina ? ' aria-current="page"' : ""}>${n}</button>`).join("")}
          <button type="button" data-ir="${pagina + 1}"${pagina === paginas ? " disabled" : ""}>›</button>
        </div>
      </div>` : "";
  }

  /* Los desplegables se llenan de lo que hay, no de una lista fija: un filtro
     con opciones que no existen en ninguna fila devuelve siempre vacío. */
  const quienes = document.getElementById("f-quien");
  [...new Set(correccionesHechas().map(quienCorrigio))]
    .forEach((k) => quienes.add(new Option(QUIEN_CORRIGIO[k], k)));

  const campos = document.getElementById("f-campo");
  [...new Set(correccionesHechas().map((c) => c.campo))]
    .forEach((k) => campos.add(new Option(CAMPO_DIRECCION[k] ?? k, k)));

  document.addEventListener("input", (e) => {
    if (e.target.matches("#q-corr, #f-desde, #f-hasta")) { pagina = 1; pintar(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.matches("#f-quien, #f-campo")) { pagina = 1; pintar(); }
    else if (e.target.matches("#por-pagina")) { porPagina = +e.target.value; pagina = 1; pintar(); }
  });
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-ir]");
    if (b && !b.disabled) { pagina = +b.dataset.ir; pintar(); return; }
    const f = e.target.closest("#f-tarde");
    if (f) {
      f.setAttribute("aria-pressed", String(f.getAttribute("aria-pressed") !== "true"));
      pagina = 1;
      pintar();
    }
  });

  pintarMetricas();
  pintar();
}
</script>
</body>
</html>
