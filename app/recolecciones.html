<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Recolecciones · The Carriers</title>
<link rel="icon" href="../assets/brand/mark-white.svg">
<link rel="stylesheet" href="../assets/app.css?v=eb632bac">
<script src="../assets/vigia.js?v=eb632bac" defer></script>
</head>
<body data-seccion="recolecciones">
<main class="contenido contenido--ancho">

  <div class="encabezado" style="margin-bottom:24px">
    <div>
      <h1>Recolecciones</h1>
      <p>Programa recolecciones de cualquier paquetería sin entrar a su portal
         y verifica su cumplimiento.</p>
    </div>
    <div class="encabezado__acciones">
      <!-- Una recolección se programa sobre guías, no sobre la nada: el camión
           recoge bultos. La acción lleva a Pedidos con las guías sin recolección
           delante y ya seleccionadas, que es donde el flujo existe, en vez de
           abrir aquí un segundo formulario que acabaría divergiendo. -->
      <a class="boton boton--primario" href="pedidos.html?pendiente=sin-recoleccion">
        Programar recolección
      </a>
    </div>
  </div>

  <div class="rejilla rejilla--3" style="margin-bottom:16px" id="metricas"></div>

  <!-- Lo que exige una acción va antes que lo que ya está resuelto. -->
  <section class="zona" id="sueltas"></section>

  <section class="zona" id="reclamo"></section>

  <section class="tarjeta" style="margin-bottom:16px">
    <div class="tarjeta__cabeza" style="padding-bottom:0;border-bottom:0">
      <div class="pestanas" role="tablist" style="border-bottom:0">
        <button class="pestana" role="tab" type="button" aria-selected="true" data-vista="proximas">Programadas</button>
        <button class="pestana" role="tab" type="button" aria-selected="false" data-vista="historial">Historial</button>
      </div>
      <div class="periodo__mando" role="group" aria-label="Periodo del historial" id="mando" hidden>
        <button class="ficha-filtro" type="button" aria-pressed="false" data-dias="7">7 días</button>
        <button class="ficha-filtro" type="button" aria-pressed="true" data-dias="30">30 días</button>
        <button class="ficha-filtro" type="button" aria-pressed="false" data-dias="">Todo</button>
      </div>
    </div>
    <div class="filtros">
      <div class="buscador">
        <label class="sr-only" for="q-reco">Buscar</label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q-reco" autocomplete="off" placeholder="Folio, paquetería, plataforma u origen">
      </div>

      <span class="filtros__div" aria-hidden="true"></span>
      <label class="sr-only" for="desde">Desde</label>
      <input type="date" id="desde" aria-label="Desde">
      <span class="filtros__etiqueta">al</span>
      <label class="sr-only" for="hasta">Hasta</label>
      <input type="date" id="hasta" aria-label="Hasta">

      <span class="filtros__div" aria-hidden="true"></span>
      <label class="sr-only" for="f-paq">Paquetería</label>
      <select id="f-paq"><option value="">Todas las paqueterías</option></select>
      <label class="sr-only" for="f-org">Origen</label>
      <select id="f-org"><option value="">Todos los orígenes</option></select>
      <label class="sr-only" for="f-via">Comprada en</label>
      <select id="f-via">
        <option value="">Directo y plataformas</option>
        <option value="directo">Solo directo</option>
      </select>
      <label class="sr-only" for="f-ven">Ventana</label>
      <select id="f-ven"><option value="">Todas las ventanas</option></select>
      <label class="sr-only" for="f-res">Resultado</label>
      <select id="f-res" hidden>
        <option value="">Todos los resultados</option>
        <option value="completa">Completas</option>
        <option value="parcial">Incompletas</option>
        <option value="fallida">Sin cumplir</option>
        <option value="sin-piezas">Sin piezas</option>
      </select>

      <button class="boton boton--sutil boton--chico" type="button" id="limpiar-filtros" hidden>
        Quitar filtros</button>
    </div>

    <div id="vista"></div>
  </section>

  <dialog class="dialogo" id="dlg-cancelar" aria-labelledby="dlg-cancelar-titulo"></dialog>
</main>

<script type="module">
import { montar, exigirSesion } from "../assets/app.js?v=eb632bac";
import { recolecciones, recoleccionesPasadas, recoleccionesProximas,
         resultadoRecoleccion, cumplimientoRecolecciones,
         origenes, menosDias, HOY,
         parejasRecoleccion, guiasSinRecoleccion,
         comoCancelar, marcarCancelacionSolicitada,
         nombrarAusencia, capacidadDe, telefonoDe, ofrece, sinRegistro } from "../assets/datos.js?v=eb632bac";
if (exigirSesion()) {
  montar();

  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
  const largo = (iso) => {
    const t = new Date(iso + "T12:00:00")
      .toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
    return t[0].toUpperCase() + t.slice(1);
  };
  const corta = (iso) =>
    new Date(iso + "T12:00:00").toLocaleDateString("es-MX", { day: "numeric", month: "short" });
  const nombreOrigen = (id) => origenes.find((o) => o.id === id)?.nombre ?? "—";

  let vista = "proximas";
  let dias = 30;
  let pagina = 1;
  let porPagina = 10;

  const mando = document.getElementById("mando");
  const zona = document.getElementById("vista");
  const desde = document.getElementById("desde");
  const hasta = document.getElementById("hasta");
  const buscar = document.getElementById("q-reco");
  const fPaq = document.getElementById("f-paq");
  const fOrg = document.getElementById("f-org");
  const fVia = document.getElementById("f-via");
  const fVen = document.getElementById("f-ven");
  const fRes = document.getElementById("f-res");
  const limpiar = document.getElementById("limpiar-filtros");

  /* Los desplegables se llenan con lo que hay, no con una lista fija: una
     opción que nunca devuelve nada es una opción que estorba. */
  for (const [sel, saca] of [[fPaq, (r) => r.paqueteria],
                             [fOrg, (r) => nombreOrigen(r.origen)],
                             [fVen, (r) => r.ventana]]) {
    [...new Set(recolecciones.map(saca))].sort()
      .forEach((v) => sel.add(new Option(v, v)));
  }
  /* Solo las plataformas que de verdad se usan, no la lista entera. */
  [...new Set(recolecciones.map((r) => r.via).filter(Boolean))].sort()
    .forEach((v) => fVia.add(new Option(v, v)));

  const sinAcentos = (t) => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  const hayFiltro = () => !!(desde.value || hasta.value || buscar.value.trim() ||
                             fPaq.value || fOrg.value || fVen.value || fVia.value || fRes.value);

  function pasa(r) {
    if (desde.value && r.fecha < desde.value) return false;
    if (hasta.value && r.fecha > hasta.value) return false;
    if (fPaq.value && r.paqueteria !== fPaq.value) return false;
    if (fOrg.value && nombreOrigen(r.origen) !== fOrg.value) return false;
    if (fVen.value && r.ventana !== fVen.value) return false;
    if (fVia.value === "directo" && r.via) return false;
    if (fVia.value && fVia.value !== "directo" && r.via !== fVia.value) return false;
    if (fRes.value && resultadoRecoleccion(r).clave !== fRes.value) return false;
    const q = sinAcentos(buscar.value.trim());
    if (q && !sinAcentos([r.folio, r.paqueteria, r.via ?? "", nombreOrigen(r.origen), r.ventana].join(" ")).includes(q)) return false;
    return true;
  }

  /* ---------- Las guías que ninguna regla toma ----------
     Arriba de la agenda porque lo que exige una acción va antes que lo que ya
     está resuelto. Nombradas, con su motivo y con la acción al lado: nunca
     barridas a una solicitud dirigida a la contraparte equivocada, que es una
     recolección que no va a ocurrir y un reclamo a quien no le toca. */
  function pintarSueltas() {
    const caja = document.getElementById("sueltas");
    const grupos = [];

    for (const x of parejasRecoleccion()) {
      if (!x.fuera.length) continue;
      const porVia = {};
      for (const p of x.fuera) (porVia[p.envio.via ?? "directo"] ||= []).push(p);
      for (const [via, guias] of Object.entries(porVia)) {
        grupos.push({ origen: x.origen, paqueteria: x.paqueteria, via, guias, regla: x.regla });
      }
    }

    /* Y las que no tienen regla ninguna: también se programan a mano, pero por
       otro motivo, y el motivo es lo que se escribe en cada fila. */
    for (const x of parejasRecoleccion()) {
      if (x.regla || !x.esperando) continue;
      const guias = guiasSinRecoleccion({ origen: x.origen, paqueteria: x.paqueteria });
      const porVia = {};
      for (const p of guias) (porVia[p.envio.via ?? "directo"] ||= []).push(p);
      for (const [via, g] of Object.entries(porVia)) {
        grupos.push({ origen: x.origen, paqueteria: x.paqueteria, via, guias: g, regla: null });
      }
    }

    /* La tarjeta solo existe cuando hay algo: un hueco decorado donde no falta
       nada es ruido. */
    if (!grupos.length) { caja.innerHTML = ""; return; }

    caja.innerHTML = `
      <div class="tarjeta">
        <div class="tarjeta__cabeza">
          <div>
            <h2>Guías sin recolección que ninguna regla toma</h2>
            <p class="apagado" style="font-size:12px;margin-top:3px">Se programan a mano.</p>
          </div>
        </div>
        <div class="tabla-caja scroll-fino">
          <table>
            <caption class="sr-only">Guías que ninguna regla de recolección incluye.</caption>
            <thead><tr>
              <th scope="col">Paquetería</th><th scope="col">Comprada en</th>
              <th scope="col">Origen</th><th scope="col">Piezas</th>
              <th scope="col"><span class="sr-only">Acción</span></th>
            </tr></thead>
            <tbody>
              ${grupos.map((g) => `<tr>
                <td><b>${esc(g.paqueteria)}</b></td>
                <td>${g.via === "directo" ? '<span class="apagado">Directo</span>' : esc(g.via)}</td>
                <td>${esc(nombreOrigen(g.origen))}
                  <div class="apagado" style="margin-top:3px;font-size:12px">${esc(
                    g.regla
                      ? `La regla de ${nombreOrigen(g.origen)} · ${g.paqueteria} pide recolección ${
                          g.regla.via ? `a ${g.regla.via}` : "directa"}.`
                      : `${nombreOrigen(g.origen)} · ${g.paqueteria} no tiene regla de recolección.`)}</div></td>
                <td class="tabular">${g.guias.length}</td>
                <td style="text-align:right">
                  <button class="boton boton--fantasma boton--chico" type="button"
                    data-programar="${g.guias.length}">Programar recolección de ${
                      plural(g.guias.length, "pieza", "piezas")}</button></td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  /* ---------- Lo que se puede reclamar ----------
     Se enseña solo cuando alguien está por debajo del 100%: si todas
     cumplieron, una tabla de cumplimiento es una tabla de ceros que ocupa
     media pantalla. */
  function pintarReclamo() {
    const stats = cumplimientoRecolecciones(dias);
    const flojas = stats.filter((s) => s.pct < 100);
    const caja = document.getElementById("reclamo");

    if (!flojas.length) {
      caja.innerHTML = `<p class="aviso aviso--ok">
        Todas las recolecciones del periodo se cumplieron sin incidencias.</p>`;
      return;
    }

    caja.innerHTML = `
      <h2 class="zona__titulo">Cumplimiento por paquetería</h2>
      <div class="tarjeta">
        <div class="tabla-caja scroll-fino">
          <table>
            <caption class="sr-only">Cumplimiento de recolección por paquetería.</caption>
            <thead><tr>
              <th scope="col">Paquetería</th><th scope="col">Cumplimiento</th>
              <th scope="col">Piezas</th><th scope="col">Recolecciones</th><th scope="col">Incidencias</th>
            </tr></thead>
            <tbody>
              ${stats.map((s) => `<tr>
                <td><b>${esc(s.paqueteria)}</b></td>
                <td>
                  <span class="pastilla pastilla--${s.pct === 100 ? "ok" : s.pct >= 90 ? "aviso" : "mal"}">${s.pct}%</span>
                </td>
                <td class="tabular"><span class="nota-celda">${s.recogidas} de ${s.programadas}</span>
                  ${s.programadas - s.recogidas
                    ? `<div class="apagado nota-celda" style="margin-top:3px;font-size:12px">
                         ${plural(s.programadas - s.recogidas, "pieza sin recoger", "piezas sin recoger")}</div>` : ""}</td>
                <td class="tabular">${s.citas}</td>
                <td>${[s.fallidas ? `${s.fallidas} sin cumplir` : "",
                       s.parciales ? plural(s.parciales, "incompleta", "incompletas") : ""]
                      .filter(Boolean).join(" · ") || "Sin incidencias"}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div class="tarjeta__pie">
          <!-- La regla se afirma de forma permanente y sin fecharla: una nota del
               tipo "desde octubre se cuenta distinto" es arqueología a los seis
               meses, y una afirmación de qué se cuenta se sostiene sola. -->
          <span>El porcentaje solo cuenta citas con piezas. Una pieza se cuenta como
                recogida cuando su guía registra el primer movimiento en la paquetería.</span>
        </div>
      </div>`;
  }

  /* ---------- Próximas: la agenda ---------- */
  const TONO_ESTADO = { "Confirmada": "ok", "Por confirmar": "aviso", "Recurrente": "info" };

  function proximasHTML() {
    const lista = recoleccionesProximas().filter(pasa).sort((a, b) => a.fecha.localeCompare(b.fecha));
    if (!lista.length) {
      return `<div class="vacio"><h3>No hay recolecciones programadas</h3>
        <p>Las guías generadas permanecen en el origen hasta que se programe una recolección.</p></div>`;
    }
    const porDia = {};
    for (const r of lista) (porDia[r.fecha] ||= []).push(r);

    /* Una sola tabla, con el día como fila que ocupa el ancho.

       Antes cada día era su propia <table>, así que cada una medía sus
       columnas por separado: "Folio" empezaba en un sitio el lunes y en otro
       el miércoles, y la pantalla se veía descuadrada sin que nada estuviera
       mal por separado. */
    const filas = Object.entries(porDia).map(([fecha, dia]) => `
      <tr class="fila-dia">
        <th scope="colgroup" colspan="7">
          ${largo(fecha)}${fecha === HOY ? " · Hoy" : ""}
          <span class="apagado" style="font-weight:400">
            · ${dia.reduce((s, r) => s + r.piezas, 0)} piezas ·
            ${plural(dia.length, "recolección", "recolecciones")}</span>
        </th>
      </tr>
      ${dia.map((r) => {
        const c = comoCancelar(r);
        return `<tr data-folio="${esc(r.folio)}">
        <td><b>${esc(r.paqueteria)}</b>${c.clave === "pedida"
          ? ' <span class="pastilla pastilla--aviso">Cancelación solicitada</span>' : ""}
          ${c.clave === "pedida" ? `<div class="apagado" style="margin-top:3px;font-size:12px">${
            esc(r.paqueteria)} no ha confirmado la cancelación.</div>` : ""}</td>
        <td>${r.via ? esc(r.via) : "<span class=\"apagado\">Directo</span>"}</td>
        <td>${esc(nombreOrigen(r.origen))}</td>
        <td class="tabular">${esc(r.ventana)}</td>
        <td class="tabular">${r.piezas}</td>
        <td class="mono apagado">${esc(r.folio)}</td>
        <td style="text-align:right">${accionCancelarHTML(r, c)}${sumarPiezasHTML(r)}</td>
      </tr>`; }).join("")}`).join("");

    return `
      <div class="tabla-caja scroll-fino">
        <table class="tabla-reco">
          <caption class="sr-only">Recolecciones programadas, agrupadas por día.</caption>
          <thead><tr>
            <th scope="col">Paquetería</th><th scope="col">Comprada en</th>
            <th scope="col">Origen</th><th scope="col">Ventana</th>
            <th scope="col">Piezas</th><th scope="col">Folio</th>
            <th scope="col"><span class="sr-only">Acciones</span></th>
          </tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
      <div class="tarjeta__pie">
        <span><b>${lista.length}</b> ${lista.length === 1 ? "recolección programada" : "recolecciones programadas"} ·
          ${lista.reduce((s, r) => s + r.piezas, 0)} piezas</span>
      </div>`;
  }

  /* ---------- Las dos cancelaciones ----------
     Desactivar la regla es nuestro y vive en Configuración. Cancelar una
     recolección YA SOLICITADA sale de la matriz, porque depende de que la
     paquetería lo exponga, y cuando no lo expone lo único que queda es una
     llamada. Las dos ausencias se ven igual y no se nombran igual. */
  function accionCancelarHTML(r, c) {
    if (c.clave === "pedida") {
      return '<span class="apagado" style="font-size:12px">Pendiente de confirmación</span>';
    }
    if (c.clave === "boton") {
      return `<button class="boton boton--sutil boton--chico" type="button"
                data-cancelar="${esc(r.folio)}">Cancelar recolección</button>
        ${c.corte ? `<div class="apagado" style="margin-top:3px;font-size:12px">Se puede
          cancelar hasta las ${esc(c.corte)}.</div>` : ""}`;
    }
    return `<button class="boton boton--sutil boton--chico" type="button"
              data-instruccion="${esc(r.folio)}">Ver qué hacer</button>
      ${c.vencido ? `<div class="apagado" style="margin-top:3px;font-size:12px">El corte para
        cancelar fue a las ${esc(c.corte)}.</div>` : ""}`;
  }

  /* ---------- Sumar piezas a una solicitud ya confirmada ----------
     Sale de la matriz, como todo lo demás. Con "sí" hay acción; con "no" o sin
     registro NO hay acción y sí hay una línea que dice qué pasa con esas
     guías, porque una capacidad que no se traduce en nada enseña más de lo que
     da. Solo en las de hoy: en las de mañana todavía no hay corte que perder. */
  function sumarPiezasHTML(r) {
    if (r.fecha !== HOY) return "";
    /* Las que entrarían en ESTA solicitud: mismo origen, misma paquetería y la
       misma plataforma con la que se pidió. */
    const tarde = guiasSinRecoleccion({ origen: r.origen, paqueteria: r.paqueteria,
                                        via: r.via ?? null });
    if (!tarde.length) return "";

    const n = tarde.length;
    const cuantas = `${n} ${n === 1 ? "guía" : "guías"}`;

    if (ofrece(r.paqueteria, "sumaPiezas")) {
      return `<div style="margin-top:6px">
        <button class="boton boton--sutil boton--chico" type="button"
          data-sumar="${esc(r.folio)}" data-piezas="${n}">Sumar ${cuantas} a esta recolección</button>
      </div>`;
    }

    return `<div class="apagado" style="margin-top:6px;font-size:12px">
      ${esc(nombrarAusencia(r.paqueteria, "sumaPiezas"))}. ${
        n === 1 ? "Esta entra" : `Estas ${n} entran`} a la del día siguiente.
      ${sinRegistro(r.paqueteria, "sumaPiezas")
        ? `<a class="boton boton--sutil boton--chico"
              href="paqueterias.html?paqueteria=${encodeURIComponent(r.paqueteria)}&capacidad=sumaPiezas"
           >Confirmar con ${esc(r.paqueteria)}</a>` : ""}
    </div>`;
  }

  const dlgCancelar = document.getElementById("dlg-cancelar");

  /* El diálogo del sistema de siempre: cancelar nombra lo que conserva. */
  function abrirCancelacion(r) {
    dlgCancelar.innerHTML = `
      <div class="dialogo__cabeza">
        <h2 id="dlg-cancelar-titulo">¿Cancelar la recolección ${esc(r.folio)}?</h2>
      </div>
      <div class="dialogo__cuerpo">
        <p>${esc(r.paqueteria)} deja de venir por las ${plural(r.piezas, "pieza", "piezas")} de
          ${esc(nombreOrigen(r.origen))} el ${esc(corta(r.fecha))}.</p>
        <p style="margin-top:8px">Las guías vuelven a contar como sin recolección y la
          siguiente ejecución de la regla las incluye sola.</p>
      </div>
      <div class="dialogo__pie">
        <button class="boton boton--sutil" type="button" data-cerrar-cancelar>Conservarla como está</button>
        <button class="boton boton--peligro" type="button" data-si-cancelar="${esc(r.folio)}">Sí, cancelar</button>
      </div>`;
    dlgCancelar.showModal();
  }

  /* Donde la paquetería no la expone: una instrucción, no una confirmación. El
     botón que cierra es fantasma y no primario, porque no completa la tarea:
     la completa una llamada. */
  function abrirInstruccion(r) {
    const modo = capacidadDe(r.paqueteria, "cancelaRecoleccion").valor === "no" ? "no" : "sin-registro";
    const tel = telefonoDe(r.paqueteria);
    dlgCancelar.innerHTML = `
      <div class="dialogo__cabeza">
        <h2 id="dlg-cancelar-titulo">Cancelar la recolección ${esc(r.folio)}</h2>
      </div>
      <div class="dialogo__cuerpo">
        <div class="instruccion instruccion--${modo}">
          <b>${esc(nombrarAusencia(r.paqueteria, "cancelaRecoleccion"))}</b>
          <ol>
            <li class="instruccion__paso">Llama a ${esc(r.paqueteria)}${tel ? ` al ${esc(tel)}` : ""}.</li>
            <li class="instruccion__paso">Cita el folio
              <span class="instruccion__dato">${esc(r.folio)}</span>.
              <button class="boton boton--sutil boton--chico" type="button"
                      data-copiar="${esc(r.folio)}">Copiar folio</button></li>
            <li class="instruccion__paso">Esta recolección queda marcada como cancelación
              solicitada y se sigue contando hasta que el rastreo diga otra cosa.</li>
            ${modo === "sin-registro" ? `<li class="instruccion__paso">Si ${esc(r.paqueteria)}
              sí cancela recolecciones, márcalo en Paqueterías para que el botón aparezca la
              próxima vez.
              <a class="boton boton--sutil boton--chico"
                 href="paqueterias.html?paqueteria=${encodeURIComponent(r.paqueteria)}&capacidad=cancelaRecoleccion"
              >Confirmar con ${esc(r.paqueteria)}</a></li>` : ""}
          </ol>
        </div>
      </div>
      <div class="dialogo__pie">
        <button class="boton boton--sutil" type="button" data-cerrar-cancelar>Conservarla como está</button>
        <button class="boton boton--fantasma" type="button"
                data-marcar-pedida="${esc(r.folio)}">Marcar cancelación solicitada</button>
      </div>`;
    dlgCancelar.showModal();
  }

  dlgCancelar.addEventListener("click", (e) => {
    if (e.target.closest("[data-cerrar-cancelar]")) return dlgCancelar.close();

    const copiar = e.target.closest("[data-copiar]");
    if (copiar) {
      navigator.clipboard?.writeText(copiar.dataset.copiar).then(() => {
        const antes = copiar.textContent;
        copiar.textContent = "Folio copiado";
        setTimeout(() => { copiar.textContent = antes; }, 1800);
      }, () => { /* sin permiso: el folio sigue a la vista */ });
      return;
    }

    const si = e.target.closest("[data-si-cancelar]");
    if (si) {
      const i = recolecciones.findIndex((x) => x.folio === si.dataset.siCancelar);
      recolecciones.splice(i, 1);
      dlgCancelar.close();
      return pintar();
    }

    const pedida = e.target.closest("[data-marcar-pedida]");
    if (pedida) {
      /* Marcada, no cancelada: la paquetería no lo ha confirmado y seguir
         contándola es lo único cierto que se puede hacer. */
      marcarCancelacionSolicitada(pedida.dataset.marcarPedida);
      dlgCancelar.close();
      pintar();
    }
  });

  /* ---------- Historial: qué pasó de verdad ---------- */
  function historialHTML() {
    const limite = dias === "" ? null : menosDias(HOY, dias);
    const lista = recoleccionesPasadas()
      .filter((r) => (!limite || r.fecha >= limite) && pasa(r))
      .sort((a, b) => b.fecha.localeCompare(a.fecha));

    if (!lista.length) {
      return `<div class="vacio"><h3>No hay recolecciones en este periodo</h3>
        <p>Amplía el rango de fechas o quita los filtros.</p></div>`;
    }

    const paginas = Math.max(1, Math.ceil(lista.length / porPagina));
    pagina = Math.min(pagina, paginas);
    const ini = (pagina - 1) * porPagina;
    const enPagina = lista.slice(ini, ini + porPagina);

    return `
      <div class="tabla-caja scroll-fino">
        <table class="tabla-reco">
          <caption class="sr-only">Recolecciones pasadas y su resultado.</caption>
          <thead><tr>
            <th scope="col">Fecha</th><th scope="col">Paquetería</th>
            <th scope="col">Comprada en</th><th scope="col">Origen</th>
            <th scope="col">Programadas</th><th scope="col">Recogidas</th>
            <th scope="col">Resultado</th>
          </tr></thead>
          <tbody>
            ${enPagina.map((r) => {
              const res = resultadoRecoleccion(r);
              return `<tr>
                <td>${esc(corta(r.fecha))}
                  <div class="mono apagado" style="margin-top:3px;font-size:11px">${esc(r.folio)}</div></td>
                <td><b>${esc(r.paqueteria)}</b>
                  <div class="apagado" style="margin-top:3px;font-size:11px">${esc(r.ventana)}</div></td>
                <td>${r.via ? esc(r.via) : '<span class="apagado">Directo</span>'}</td>
                <td>${esc(nombreOrigen(r.origen))}</td>
                <td class="tabular">${res.clave === "sin-piezas" ? "—" : r.piezas}</td>
                <td class="tabular"${res.clave !== "sin-piezas" && r.recogidas < r.piezas
                  ? ' style="color:var(--mal)"' : ""}>${res.clave === "sin-piezas" ? "—" : r.recogidas}</td>
                <td><span class="pastilla pastilla--${res.tono}">${esc(res.texto)}</span>
                  ${res.nota ? `<div class="apagado nota-celda" style="margin-top:3px;font-size:12px">${
                    esc(res.nota)}</div>` : ""}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
      <div class="tarjeta__pie">
        <span>Mostrando <b>${ini + 1}–${ini + enPagina.length}</b> de <b>${lista.length}</b> ·
          ${lista.reduce((s, r) => s + (r.recogidas ?? 0), 0)} de
          ${lista.reduce((s, r) => s + r.piezas, 0)} piezas recogidas</span>
        <label class="filtros__etiqueta" for="por-pagina-reco">
          <select id="por-pagina-reco" style="width:auto;margin-left:8px">
            ${[10, 25, 50].map((n) =>
              `<option value="${n}"${n === porPagina ? " selected" : ""}>${n} por página</option>`).join("")}
          </select>
        </label>
        <span class="filtros__sep"></span>
        <div class="paginacion"${paginas === 1 ? " hidden" : ""}>
          <button type="button" data-ir="${pagina - 1}"${pagina === 1 ? " disabled" : ""}>‹</button>
          ${Array.from({ length: paginas }, (_, i) => i + 1).map((n) =>
            `<button type="button" data-ir="${n}"${n === pagina ? ' aria-current="page"' : ""}>${n}</button>`).join("")}
          <button type="button" data-ir="${pagina + 1}"${pagina === paginas ? " disabled" : ""}>›</button>
        </div>
      </div>`;
  }

  function pintar() {
    document.querySelectorAll("[data-vista]").forEach((b) =>
      b.setAttribute("aria-selected", String(b.dataset.vista === vista)));
    mando.hidden = vista !== "historial";
    /* El resultado solo existe en el historial: una recolección que todavía
       no ocurre no tiene ninguno. */
    fRes.hidden = vista !== "historial";
    if (vista !== "historial") fRes.value = "";
    limpiar.hidden = !hayFiltro();
    document.querySelectorAll("[data-vista]").forEach((b) =>
      b.setAttribute("aria-selected", String(b.dataset.vista === vista)));
    zona.innerHTML = vista === "proximas" ? proximasHTML() : historialHTML();

    /* Las cifras miran siempre al pasado: lo programado todavía no dice nada
       de nadie. */
    const stats = cumplimientoRecolecciones(dias === "" ? null : dias);
    const programadas = stats.reduce((s, x) => s + x.programadas, 0);
    const recogidas = stats.reduce((s, x) => s + x.recogidas, 0);
    const fallidas = stats.reduce((s, x) => s + x.fallidas, 0);
    const pct = programadas ? Math.round((recogidas / programadas) * 100) : null;
    const periodo = dias === "" ? "Todo el historial" : `Últimos ${dias} días`;

    const metrica = (etiqueta, valor, nota, tono = "") =>
      `<div class="metrica"><p class="metrica__etiqueta">${etiqueta}</p>
       <p class="metrica__valor tabular"${tono}>${valor}</p><p class="metrica__nota">${nota}</p></div>`;

    document.getElementById("metricas").innerHTML =
      metrica("Cumplimiento", pct === null ? "—" : `${pct}%`, periodo,
              pct !== null && pct < 95 ? ' style="color:var(--mal)"' : "") +
      metrica("Piezas sin recoger", programadas - recogidas,
              programadas - recogidas ? "Permanecen en el origen" : "Ninguna",
              programadas - recogidas ? ' style="color:var(--mal)"' : "") +
      metrica("Recolecciones sin cumplir", fallidas,
              fallidas ? "La paquetería no se presentó" : "Sin incidencias");

    pintarSueltas();
    pintarReclamo();
  }

  document.querySelectorAll("[data-vista]").forEach((b) =>
    b.addEventListener("click", () => { vista = b.dataset.vista; pintar(); }));

  const alFiltrar = () => { pagina = 1; pintar(); };
  [desde, hasta, fPaq, fOrg, fVen, fVia, fRes].forEach((c) => c.addEventListener("change", alFiltrar));
  buscar.addEventListener("input", alFiltrar);
  limpiar.addEventListener("click", () => {
    desde.value = hasta.value = "";
    buscar.value = fPaq.value = fOrg.value = fVen.value = fVia.value = fRes.value = "";
    alFiltrar();
  });

  zona.addEventListener("click", (e) => {
    const ir = e.target.closest("[data-ir]");
    if (ir && !ir.disabled) { pagina = +ir.dataset.ir; pintar(); }

    const cancelar = e.target.closest("[data-cancelar]");
    if (cancelar) {
      return abrirCancelacion(recolecciones.find((r) => r.folio === cancelar.dataset.cancelar));
    }
    const instruccion = e.target.closest("[data-instruccion]");
    if (instruccion) {
      return abrirInstruccion(recolecciones.find((r) => r.folio === instruccion.dataset.instruccion));
    }

    const sumar = e.target.closest("[data-sumar]");
    if (sumar) {
      const n = +sumar.dataset.piezas;
      dlgCancelar.innerHTML = `
        <div class="dialogo__cabeza">
          <h2 id="dlg-cancelar-titulo">Sumar ${plural(n, "guía", "guías")} a ${esc(sumar.dataset.sumar)}</h2>
        </div>
        <div class="dialogo__cuerpo">
          <p class="aviso aviso--info">La solicitud ya confirmada pasaría a declarar
            ${plural(n, "pieza", "piezas")} más. En el prototipo la acción llega hasta aquí:
            falta el endpoint de la paquetería.</p>
        </div>
        <div class="dialogo__pie">
          <button class="boton boton--primario" type="button" data-cerrar-cancelar>Entendido</button>
        </div>`;
      dlgCancelar.showModal();
    }
  });

  /* La extraordinaria llega prellenada con las piezas que se quedaron: el
     sistema no la programa solo, porque pedir un camión tiene costo en algunos
     contratos y una consecuencia comercial que el sistema no conoce. */
  document.getElementById("sueltas").addEventListener("click", (e) => {
    const b = e.target.closest("[data-programar]");
    if (!b) return;
    const n = +b.dataset.programar;
    dlgCancelar.innerHTML = `
      <div class="dialogo__cabeza">
        <h2 id="dlg-cancelar-titulo">Programar recolección de ${plural(n, "pieza", "piezas")}</h2>
      </div>
      <div class="dialogo__cuerpo">
        <p class="aviso aviso--info">La solicitud llega prellenada con las piezas que se
          quedaron. En el prototipo la acción llega hasta aquí: falta el endpoint de la
          paquetería.</p>
      </div>
      <div class="dialogo__pie">
        <button class="boton boton--primario" type="button" data-cerrar-cancelar>Entendido</button>
      </div>`;
    dlgCancelar.showModal();
  });
  zona.addEventListener("change", (e) => {
    if (!e.target.matches("#por-pagina-reco")) return;
    porPagina = +e.target.value;
    pagina = 1;
    pintar();
  });

  mando.querySelectorAll("[data-dias]").forEach((b) =>
    b.addEventListener("click", () => {
      mando.querySelectorAll("[data-dias]").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
      dias = b.dataset.dias === "" ? "" : +b.dataset.dias;
      pagina = 1;
      pintar();
    }));

  /* Los atajos desde Configuración. Un aviso que promete "ver las tres citas"
     y deja la lista entera delante obliga a buscarlas a mano, que es lo que el
     aviso existía para ahorrar. */
  const url = new URLSearchParams(location.search);
  const pareja = url.get("pareja");
  if (pareja) {
    const [origen, paqueteria] = pareja.split("|");
    fPaq.value = paqueteria;
    fOrg.value = nombreOrigen(origen);
    vista = "historial";
    fRes.value = "fallida";
  }
  const sueltas = url.get("sueltas");
  if (sueltas) {
    const [origen, paqueteria] = sueltas.split("|");
    fPaq.value = paqueteria;
    fOrg.value = nombreOrigen(origen);
  }

  pintar();

  /* El destino del atajo de las guías sueltas es la tarjeta, no la agenda. */
  if (sueltas) document.getElementById("sueltas").scrollIntoView({ block: "center" });
}
</script>
</body>
</html>
