<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Recolecciones · The Carriers</title>
<link rel="icon" href="../assets/brand/mark-white.svg">
<link rel="stylesheet" href="../assets/app.css?v=0d936824">
<script src="../assets/vigia.js?v=0d936824" defer></script>
</head>
<body data-seccion="recolecciones">
<main class="contenido contenido--ancho">

  <div class="encabezado" style="margin-bottom:24px">
    <div>
      <h1>Recolecciones</h1>
      <p>Programa recolecciones de cualquier paquetería sin entrar a su portal
         y verifica su cumplimiento.</p>
    </div>
    <div class="encabezado__acciones">
      <button class="boton boton--primario" type="button">Programar recolección</button>
    </div>
  </div>

  <div class="rejilla rejilla--3" style="margin-bottom:16px" id="metricas"></div>

  <section class="zona" id="reclamo"></section>

  <section class="tarjeta" style="margin-bottom:16px">
    <div class="tarjeta__cabeza" style="padding-bottom:0;border-bottom:0">
      <div class="pestanas" role="tablist" style="border-bottom:0">
        <button class="pestana" role="tab" type="button" aria-selected="true" data-vista="proximas">Programadas</button>
        <button class="pestana" role="tab" type="button" aria-selected="false" data-vista="historial">Historial</button>
      </div>
      <div class="periodo__mando" role="group" aria-label="Periodo del historial" id="mando" hidden>
        <button class="ficha-filtro" type="button" aria-pressed="false" data-dias="7">7 días</button>
        <button class="ficha-filtro" type="button" aria-pressed="true" data-dias="30">30 días</button>
        <button class="ficha-filtro" type="button" aria-pressed="false" data-dias="">Todo</button>
      </div>
    </div>
    <div class="filtros">
      <div class="buscador">
        <label class="sr-only" for="q-reco">Buscar</label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q-reco" autocomplete="off" placeholder="Folio, paquetería, plataforma u origen">
      </div>

      <span class="filtros__div" aria-hidden="true"></span>
      <label class="sr-only" for="desde">Desde</label>
      <input type="date" id="desde" aria-label="Desde">
      <span class="filtros__etiqueta">al</span>
      <label class="sr-only" for="hasta">Hasta</label>
      <input type="date" id="hasta" aria-label="Hasta">

      <span class="filtros__div" aria-hidden="true"></span>
      <label class="sr-only" for="f-paq">Paquetería</label>
      <select id="f-paq"><option value="">Todas las paqueterías</option></select>
      <label class="sr-only" for="f-org">Origen</label>
      <select id="f-org"><option value="">Todos los orígenes</option></select>
      <label class="sr-only" for="f-via">Comprada en</label>
      <select id="f-via">
        <option value="">Directo y plataformas</option>
        <option value="directo">Solo directo</option>
      </select>
      <label class="sr-only" for="f-ven">Ventana</label>
      <select id="f-ven"><option value="">Todas las ventanas</option></select>
      <label class="sr-only" for="f-res">Resultado</label>
      <select id="f-res" hidden>
        <option value="">Todos los resultados</option>
        <option value="completa">Completas</option>
        <option value="parcial">Incompletas</option>
        <option value="fallida">Sin cumplir</option>
      </select>

      <button class="boton boton--sutil boton--chico" type="button" id="limpiar-filtros" hidden>
        Quitar filtros</button>
    </div>

    <div id="vista"></div>
  </section>

</main>

<script type="module">
import { montar, exigirSesion } from "../assets/app.js?v=0d936824";
import { recolecciones, recoleccionesPasadas, recoleccionesProximas,
         resultadoRecoleccion, cumplimientoRecolecciones,
         origenes, menosDias, HOY } from "../assets/datos.js?v=0d936824";
if (exigirSesion()) {
  montar();

  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
  const largo = (iso) => {
    const t = new Date(iso + "T12:00:00")
      .toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
    return t[0].toUpperCase() + t.slice(1);
  };
  const corta = (iso) =>
    new Date(iso + "T12:00:00").toLocaleDateString("es-MX", { day: "numeric", month: "short" });
  const nombreOrigen = (id) => origenes.find((o) => o.id === id)?.nombre ?? "—";

  let vista = "proximas";
  let dias = 30;
  let pagina = 1;
  let porPagina = 10;

  const mando = document.getElementById("mando");
  const zona = document.getElementById("vista");
  const desde = document.getElementById("desde");
  const hasta = document.getElementById("hasta");
  const buscar = document.getElementById("q-reco");
  const fPaq = document.getElementById("f-paq");
  const fOrg = document.getElementById("f-org");
  const fVia = document.getElementById("f-via");
  const fVen = document.getElementById("f-ven");
  const fRes = document.getElementById("f-res");
  const limpiar = document.getElementById("limpiar-filtros");

  /* Los desplegables se llenan con lo que hay, no con una lista fija: una
     opción que nunca devuelve nada es una opción que estorba. */
  for (const [sel, saca] of [[fPaq, (r) => r.paqueteria],
                             [fOrg, (r) => nombreOrigen(r.origen)],
                             [fVen, (r) => r.ventana]]) {
    [...new Set(recolecciones.map(saca))].sort()
      .forEach((v) => sel.add(new Option(v, v)));
  }
  /* Solo las plataformas que de verdad se usan, no la lista entera. */
  [...new Set(recolecciones.map((r) => r.via).filter(Boolean))].sort()
    .forEach((v) => fVia.add(new Option(v, v)));

  const sinAcentos = (t) => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  const hayFiltro = () => !!(desde.value || hasta.value || buscar.value.trim() ||
                             fPaq.value || fOrg.value || fVen.value || fVia.value || fRes.value);

  function pasa(r) {
    if (desde.value && r.fecha < desde.value) return false;
    if (hasta.value && r.fecha > hasta.value) return false;
    if (fPaq.value && r.paqueteria !== fPaq.value) return false;
    if (fOrg.value && nombreOrigen(r.origen) !== fOrg.value) return false;
    if (fVen.value && r.ventana !== fVen.value) return false;
    if (fVia.value === "directo" && r.via) return false;
    if (fVia.value && fVia.value !== "directo" && r.via !== fVia.value) return false;
    if (fRes.value && resultadoRecoleccion(r).clave !== fRes.value) return false;
    const q = sinAcentos(buscar.value.trim());
    if (q && !sinAcentos([r.folio, r.paqueteria, r.via ?? "", nombreOrigen(r.origen), r.ventana].join(" ")).includes(q)) return false;
    return true;
  }

  /* ---------- Lo que se puede reclamar ----------
     Se enseña solo cuando alguien está por debajo del 100%: si todas
     cumplieron, una tabla de cumplimiento es una tabla de ceros que ocupa
     media pantalla. */
  function pintarReclamo() {
    const stats = cumplimientoRecolecciones(dias);
    const flojas = stats.filter((s) => s.pct < 100);
    const caja = document.getElementById("reclamo");

    if (!flojas.length) {
      caja.innerHTML = `<p class="aviso aviso--ok">
        Todas las recolecciones del periodo se cumplieron sin incidencias.</p>`;
      return;
    }

    caja.innerHTML = `
      <h2 class="zona__titulo">Cumplimiento por paquetería</h2>
      <div class="tarjeta">
        <div class="tabla-caja scroll-fino">
          <table>
            <caption class="sr-only">Cumplimiento de recolección por paquetería.</caption>
            <thead><tr>
              <th scope="col">Paquetería</th><th scope="col">Cumplimiento</th>
              <th scope="col">Piezas</th><th scope="col">Recolecciones</th><th scope="col">Incidencias</th>
            </tr></thead>
            <tbody>
              ${stats.map((s) => `<tr>
                <td><b>${esc(s.paqueteria)}</b></td>
                <td>
                  <span class="pastilla pastilla--${s.pct === 100 ? "ok" : s.pct >= 90 ? "aviso" : "mal"}">${s.pct}%</span>
                </td>
                <td class="tabular"><span class="nota-celda">${s.recogidas} de ${s.programadas}</span>
                  ${s.programadas - s.recogidas
                    ? `<div class="apagado nota-celda" style="margin-top:3px;font-size:12px">
                         ${plural(s.programadas - s.recogidas, "pieza sin recoger", "piezas sin recoger")}</div>` : ""}</td>
                <td class="tabular">${s.citas}</td>
                <td>${[s.fallidas ? `${s.fallidas} sin cumplir` : "",
                       s.parciales ? plural(s.parciales, "incompleta", "incompletas") : ""]
                      .filter(Boolean).join(" · ") || "Sin incidencias"}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div class="tarjeta__pie">
          <span>Una pieza se cuenta como recogida cuando su guía registra el primer
                movimiento en la paquetería.</span>
        </div>
      </div>`;
  }

  /* ---------- Próximas: la agenda ---------- */
  const TONO_ESTADO = { "Confirmada": "ok", "Por confirmar": "aviso", "Recurrente": "info" };

  function proximasHTML() {
    const lista = recoleccionesProximas().filter(pasa).sort((a, b) => a.fecha.localeCompare(b.fecha));
    if (!lista.length) {
      return `<div class="vacio"><h3>No hay recolecciones programadas</h3>
        <p>Las guías generadas permanecen en el origen hasta que se programe una recolección.</p></div>`;
    }
    const porDia = {};
    for (const r of lista) (porDia[r.fecha] ||= []).push(r);

    /* Una sola tabla, con el día como fila que ocupa el ancho.

       Antes cada día era su propia <table>, así que cada una medía sus
       columnas por separado: "Folio" empezaba en un sitio el lunes y en otro
       el miércoles, y la pantalla se veía descuadrada sin que nada estuviera
       mal por separado. */
    const filas = Object.entries(porDia).map(([fecha, dia]) => `
      <tr class="fila-dia">
        <th scope="colgroup" colspan="7">
          ${largo(fecha)}${fecha === HOY ? " · Hoy" : ""}
          <span class="apagado" style="font-weight:400">
            · ${dia.reduce((s, r) => s + r.piezas, 0)} piezas ·
            ${plural(dia.length, "recolección", "recolecciones")}</span>
        </th>
      </tr>
      ${dia.map((r) => `<tr>
        <td><b>${esc(r.paqueteria)}</b></td>
        <td>${r.via ? esc(r.via) : "<span class=\"apagado\">Directo</span>"}</td>
        <td>${esc(nombreOrigen(r.origen))}</td>
        <td class="tabular">${esc(r.ventana)}</td>
        <td class="tabular">${r.piezas}</td>
        <td class="mono apagado">${esc(r.folio)}</td>
        <td style="text-align:right">
          <button class="boton boton--sutil boton--chico" type="button">Cancelar</button></td>
      </tr>`).join("")}`).join("");

    return `
      <div class="tabla-caja scroll-fino">
        <table class="tabla-reco">
          <caption class="sr-only">Recolecciones programadas, agrupadas por día.</caption>
          <thead><tr>
            <th scope="col">Paquetería</th><th scope="col">Comprada en</th>
            <th scope="col">Origen</th><th scope="col">Ventana</th>
            <th scope="col">Piezas</th><th scope="col">Folio</th>
            <th scope="col"><span class="sr-only">Acciones</span></th>
          </tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
      <div class="tarjeta__pie">
        <span><b>${lista.length}</b> ${lista.length === 1 ? "recolección programada" : "recolecciones programadas"} ·
          ${lista.reduce((s, r) => s + r.piezas, 0)} piezas</span>
      </div>`;
  }

  /* ---------- Historial: qué pasó de verdad ---------- */
  function historialHTML() {
    const limite = dias === "" ? null : menosDias(HOY, dias);
    const lista = recoleccionesPasadas()
      .filter((r) => (!limite || r.fecha >= limite) && pasa(r))
      .sort((a, b) => b.fecha.localeCompare(a.fecha));

    if (!lista.length) {
      return `<div class="vacio"><h3>No hay recolecciones en este periodo</h3>
        <p>Amplía el rango de fechas o quita los filtros.</p></div>`;
    }

    const paginas = Math.max(1, Math.ceil(lista.length / porPagina));
    pagina = Math.min(pagina, paginas);
    const ini = (pagina - 1) * porPagina;
    const enPagina = lista.slice(ini, ini + porPagina);

    return `
      <div class="tabla-caja scroll-fino">
        <table class="tabla-reco">
          <caption class="sr-only">Recolecciones pasadas y su resultado.</caption>
          <thead><tr>
            <th scope="col">Fecha</th><th scope="col">Paquetería</th>
            <th scope="col">Comprada en</th><th scope="col">Origen</th>
            <th scope="col">Programadas</th><th scope="col">Recogidas</th>
            <th scope="col">Resultado</th>
          </tr></thead>
          <tbody>
            ${enPagina.map((r) => {
              const res = resultadoRecoleccion(r);
              return `<tr>
                <td>${esc(corta(r.fecha))}
                  <div class="mono apagado" style="margin-top:3px;font-size:11px">${esc(r.folio)}</div></td>
                <td><b>${esc(r.paqueteria)}</b>
                  <div class="apagado" style="margin-top:3px;font-size:11px">${esc(r.ventana)}</div></td>
                <td>${r.via ? esc(r.via) : '<span class="apagado">Directo</span>'}</td>
                <td>${esc(nombreOrigen(r.origen))}</td>
                <td class="tabular">${r.piezas}</td>
                <td class="tabular"${r.recogidas < r.piezas ? ' style="color:#fca5a5"' : ""}>${r.recogidas}</td>
                <td><span class="pastilla pastilla--${res.tono}">${esc(res.texto)}</span></td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
      <div class="tarjeta__pie">
        <span>Mostrando <b>${ini + 1}–${ini + enPagina.length}</b> de <b>${lista.length}</b> ·
          ${lista.reduce((s, r) => s + r.recogidas, 0)} de
          ${lista.reduce((s, r) => s + r.piezas, 0)} piezas recogidas</span>
        <label class="filtros__etiqueta" for="por-pagina-reco">
          <select id="por-pagina-reco" style="width:auto;margin-left:8px">
            ${[10, 25, 50].map((n) =>
              `<option value="${n}"${n === porPagina ? " selected" : ""}>${n} por página</option>`).join("")}
          </select>
        </label>
        <span class="filtros__sep"></span>
        <div class="paginacion"${paginas === 1 ? " hidden" : ""}>
          <button type="button" data-ir="${pagina - 1}"${pagina === 1 ? " disabled" : ""}>‹</button>
          ${Array.from({ length: paginas }, (_, i) => i + 1).map((n) =>
            `<button type="button" data-ir="${n}"${n === pagina ? ' aria-current="page"' : ""}>${n}</button>`).join("")}
          <button type="button" data-ir="${pagina + 1}"${pagina === paginas ? " disabled" : ""}>›</button>
        </div>
      </div>`;
  }

  function pintar() {
    mando.hidden = vista !== "historial";
    /* El resultado solo existe en el historial: una recolección que todavía
       no ocurre no tiene ninguno. */
    fRes.hidden = vista !== "historial";
    if (vista !== "historial") fRes.value = "";
    limpiar.hidden = !hayFiltro();
    document.querySelectorAll("[data-vista]").forEach((b) =>
      b.setAttribute("aria-selected", String(b.dataset.vista === vista)));
    zona.innerHTML = vista === "proximas" ? proximasHTML() : historialHTML();

    /* Las cifras miran siempre al pasado: lo programado todavía no dice nada
       de nadie. */
    const stats = cumplimientoRecolecciones(dias === "" ? null : dias);
    const programadas = stats.reduce((s, x) => s + x.programadas, 0);
    const recogidas = stats.reduce((s, x) => s + x.recogidas, 0);
    const fallidas = stats.reduce((s, x) => s + x.fallidas, 0);
    const pct = programadas ? Math.round((recogidas / programadas) * 100) : null;
    const periodo = dias === "" ? "Todo el historial" : `Últimos ${dias} días`;

    const metrica = (etiqueta, valor, nota, tono = "") =>
      `<div class="metrica"><p class="metrica__etiqueta">${etiqueta}</p>
       <p class="metrica__valor tabular"${tono}>${valor}</p><p class="metrica__nota">${nota}</p></div>`;

    document.getElementById("metricas").innerHTML =
      metrica("Cumplimiento", pct === null ? "—" : `${pct}%`, periodo,
              pct !== null && pct < 95 ? ' style="color:#fca5a5"' : "") +
      metrica("Piezas sin recoger", programadas - recogidas,
              programadas - recogidas ? "Permanecen en el origen" : "Ninguna",
              programadas - recogidas ? ' style="color:#fca5a5"' : "") +
      metrica("Recolecciones sin cumplir", fallidas,
              fallidas ? "La paquetería no se presentó" : "Sin incidencias");

    pintarReclamo();
  }

  document.querySelectorAll("[data-vista]").forEach((b) =>
    b.addEventListener("click", () => { vista = b.dataset.vista; pintar(); }));

  const alFiltrar = () => { pagina = 1; pintar(); };
  [desde, hasta, fPaq, fOrg, fVen, fVia, fRes].forEach((c) => c.addEventListener("change", alFiltrar));
  buscar.addEventListener("input", alFiltrar);
  limpiar.addEventListener("click", () => {
    desde.value = hasta.value = "";
    buscar.value = fPaq.value = fOrg.value = fVen.value = fVia.value = fRes.value = "";
    alFiltrar();
  });

  zona.addEventListener("click", (e) => {
    const ir = e.target.closest("[data-ir]");
    if (ir && !ir.disabled) { pagina = +ir.dataset.ir; pintar(); }
  });
  zona.addEventListener("change", (e) => {
    if (!e.target.matches("#por-pagina-reco")) return;
    porPagina = +e.target.value;
    pagina = 1;
    pintar();
  });

  mando.querySelectorAll("[data-dias]").forEach((b) =>
    b.addEventListener("click", () => {
      mando.querySelectorAll("[data-dias]").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
      dias = b.dataset.dias === "" ? "" : +b.dataset.dias;
      pagina = 1;
      pintar();
    }));

  pintar();
}
</script>
</body>
</html>
