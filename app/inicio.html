<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Inicio · The Carriers</title>
<link rel="icon" href="../assets/brand/mark-white.svg">
<link rel="stylesheet" href="../assets/app.css?v=a8786376">
<script src="../assets/vigia.js?v=a8786376" defer></script>
</head>
<body data-seccion="inicio">
<main class="contenido contenido--ancho">

  <!-- 1 · Encabezado: el resumen del día -->
  <div class="encabezado" style="margin-bottom:24px">
    <div>
      <h1>Inicio</h1>
      <p class="apagado" id="resumen-dia" style="margin-top:6px;font-size:13px"></p>
    </div>
  </div>

  <!-- 2 · Requiere tu atención · 3 · Por hacer hoy · 4 · Conexiones si falla -->
  <div id="atencion"></div>

  <!-- 5 · Tu operación -->
  <section class="zona zona--analitica">
    <div class="periodo__cabeza">
      <h2 class="zona__titulo" id="rotulo-periodo">Tu operación</h2>
      <div class="periodo__mando" role="group" aria-labelledby="rotulo-periodo">
        <button class="ficha-filtro" type="button" aria-pressed="false" data-dias="0">Hoy</button>
        <button class="ficha-filtro" type="button" aria-pressed="true" data-dias="7">7 días</button>
        <button class="ficha-filtro" type="button" aria-pressed="false" data-dias="30">30 días</button>
      </div>
    </div>
    <dl class="periodo" id="periodo"></dl>
  </section>

</main>

<script type="module">
import { montar, exigirSesion } from "../assets/app.js?v=a8786376";
import { pedidos, PENDIENTES, recoleccionesHoy, antiguedadDe,
         resumenPeriodo, comparativaPeriodo,
         conexionesCaidas, reconectar, romperConexion,
         dineroMXN } from "../assets/datos.js?v=a8786376";
if (exigirSesion()) {
  montar();

  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  const dias = (n) => `${n} ${n === 1 ? "día" : "días"}`;
  const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;

  /* Inicio contesta tres preguntas, en este orden: qué está mal, qué hay que
     hacer hoy, y cómo va la operación. Por eso "Requiere tu atención" es lo
     primero y las cifras de análisis quedan al final, más chicas.

     Aquí no se opera: cada tarjeta es un enlace que deja la pantalla de
     destino ya filtrada y, cuando la acción se resuelve en lote, ya
     seleccionada, mediante `?pendiente=`.

     Los números salen de `PENDIENTES`, el mismo objeto con el que la tabla de
     Pedidos filtra. Con un predicado para contar y otro para filtrar, un día
     la cifra dice tres y al llegar hay dos. */
  const cuenta = (clave) => pedidos.filter(PENDIENTES[clave].pasa).length;
  const irA = (clave) => clave === "detenidos" ? "excepciones.html" : `pedidos.html?pendiente=${clave}`;

  /* La etiqueta dice QUÉ es; la acción dice QUÉ se puede hacer. Separarlas
     evita el rótulo largo que no cabe debajo de un número grande. */
  const TARJETAS = {
    atencion: [
      { clave: "error-guia", et: (n) => n === 1 ? "Guía no generada" : "Guías no generadas",
        accion: "Revisar guía", antiguedad: true },
      { clave: "detenidos", et: () => "Detenidos en paquetería",
        accion: "Ver detenidos", antiguedad: true },
      { clave: "por-corregir", et: () => "Direcciones por corregir",
        accion: "Corregir direcciones" },
    ],
    hacer: [
      { clave: "pagados-sin-guia", et: () => "Pagados sin guía",
        accion: "Generar guía", antiguedad: true },
      { clave: "sin-recoleccion", et: () => "Guías sin recolección",
        accion: "Programar recolección" },
      { clave: "recolecciones-hoy", et: () => "Recolecciones de hoy",
        accion: "Ver recolecciones" },
    ],
  };

  function tarjeta(def, tono) {
    /* Recolecciones de hoy no es un pendiente de la lista de pedidos: es una
       agenda, y su nota es la ventana más próxima, no una antigüedad. */
    if (def.clave === "recolecciones-hoy") {
      const n = recoleccionesHoy.length;
      const r = recoleccionesHoy[0];
      return pintar({
        n, et: def.et(n), accion: def.accion,
        nota: r ? `${esc(r.paqueteria)} · ${esc(r.ventana)} · ${plural(r.piezas, "pieza", "piezas")}` : "",
        href: n ? "recolecciones.html" : null, tono,
      });
    }
    const n = cuenta(def.clave);
    const viejo = def.antiguedad && n ? antiguedadDe(def.clave) : null;
    return pintar({
      n, et: def.et(n), accion: def.accion,
      nota: viejo ? `el más antiguo lleva ${dias(viejo.dias)}` : "",
      href: n ? irA(def.clave) : null, tono,
    });
  }

  /* En cero deja de ser enlace y pierde su acción: no hay nada que revisar.
     Se pinta como <div> porque un <a> no se puede deshabilitar y uno sin
     destino sigue recibiendo foco del teclado. */
  function pintar({ n, et, nota, accion, href, tono }) {
    const clases = ["tarjeta-cifra", n === 0 ? "tarjeta-cifra--cero" : `tarjeta-cifra--${tono}`].join(" ");
    const cuerpo = `<span class="tarjeta-cifra__n">${n}</span>
      <span class="tarjeta-cifra__et">${esc(et)}</span>
      ${nota ? `<span class="tarjeta-cifra__nota">${nota}</span>` : ""}`;
    return href
      ? `<a class="${clases}" href="${href}">${cuerpo}
           <span class="tarjeta-cifra__ir">${esc(accion)} <i aria-hidden="true">→</i></span>
         </a>`
      : `<div class="${clases}">${cuerpo}</div>`;
  }

  function franjaConexion() {
    const caidas = conexionesCaidas();
    if (!caidas.length) return "";
    return caidas.map((c) => `<div class="franja-conexion">
      <b>${esc(c.nombre)} · ${esc(c.motivo)} desde ${esc(c.desde)}</b>
      <span>${esc(c.detalle)}</span>
      <span class="franja-conexion__sep"></span>
      <button class="boton boton--primario boton--chico" type="button"
        data-reconectar="${esc(c.id)}">Reconectar</button>
    </div>`).join("");
  }

  const atencion = document.getElementById("atencion");

  function pintarAtencion() {
    const pendientes = Object.keys(PENDIENTES).reduce((s, k) => s + cuenta(k), 0);
    const conexion = franjaConexion();

    /* Con todo en cero, las dos zonas se colapsan en una línea. "Tu operación"
       se queda: no depende de que haya pendientes. */
    if (pendientes === 0 && recoleccionesHoy.length === 0) {
      atencion.innerHTML = `<p class="nada-pendiente"><b>Nada pendiente.</b>
        <span>Ningún pedido sin guía ni envío detenido.</span></p>${conexion}`;
      return;
    }

    /* Dentro de "Requiere tu atención" manda el caso más viejo: lo que lleva
       más tiempo parado es lo que el cliente ya está esperando. */
    const urgentes = [...TARJETAS.atencion].sort((a, b) =>
      (antiguedadDe(b.clave)?.dias ?? -1) - (antiguedadDe(a.clave)?.dias ?? -1));

    atencion.innerHTML = `
      <section class="zona">
        <h2 class="zona__titulo">Requiere tu atención</h2>
        <div class="tarjetas">${urgentes.map((t) => tarjeta(t, "alerta")).join("")}</div>
      </section>
      <section class="zona">
        <h2 class="zona__titulo">Por hacer hoy</h2>
        <div class="tarjetas">${TARJETAS.hacer.map((t) => tarjeta(t, "pendiente")).join("")}</div>
      </section>
      ${conexion}`;
  }

  /* ---------- Tu operación ---------- */
  const periodo = document.getElementById("periodo");
  const fichas = [...document.querySelectorAll("[data-dias]")];

  /* La variación solo se pinta si el periodo anterior tiene datos. Con los
     datos de ejemplo actuales casi nunca los tiene, y entonces no aparece
     nada: un "↑ 0%" contra una ventana vacía sería un número inventado. */
  function variacion(valor, sufijo = "%") {
    if (valor === null || valor === undefined) return "";
    const signo = valor > 0 ? "↑" : valor < 0 ? "↓" : "→";
    const clase = valor > 0 ? "periodo__var--sube" : valor < 0 ? "periodo__var--baja" : "";
    return `<span class="periodo__var ${clase}">${signo} ${Math.abs(valor)}${sufijo} vs periodo anterior</span>`;
  }

  function pintarPeriodo(n) {
    const r = resumenPeriodo(n);
    const v = comparativaPeriodo(n);
    periodo.innerHTML = [
      ["Pedidos recibidos", r.pedidos, v && variacion(v.pedidos)],
      ["Guías generadas", r.guias, v && variacion(v.guias)],
      ["Entregados a tiempo", r.aTiempoPct === null ? "—" : `${r.aTiempoPct}%`,
        v && variacion(v.aTiempoPct, " pts")],
      ["Costo total de guías", dineroMXN(r.costo), v && variacion(v.costo)],
    ].map(([et, valor, cambio]) =>
      `<div class="periodo__dato"><dt>${et}</dt><dd>${valor}${cambio || ""}</dd></div>`).join("");
  }

  fichas.forEach((f) => f.addEventListener("click", () => {
    fichas.forEach((o) => o.setAttribute("aria-pressed", String(o === f)));
    pintarPeriodo(+f.dataset.dias);
  }));

  atencion.addEventListener("click", (e) => {
    if (e.target.closest("[data-reconectar]")) { reconectar(); pintarAtencion(); }
  });

  /* Gancho para ver la franja de conexiones sin romper nada de verdad:
     ?conexion=shopify la levanta y "Reconectar" la baja. La URL se limpia para
     que una recarga no la vuelva a encender. */
  const romper = new URLSearchParams(location.search).get("conexion");
  if (romper) {
    romperConexion(romper);
    history.replaceState(null, "", location.pathname);
  }

  const resumenHoy = resumenPeriodo(0);
  document.getElementById("resumen-dia").textContent =
    `Hoy: ${plural(resumenHoy.pedidos, "pedido", "pedidos")} · ` +
    `${cuenta("pagados-sin-guia")} sin guía · ` +
    `${cuenta("detenidos")} detenidos · ` +
    plural(recoleccionesHoy.length, "recolección", "recolecciones");

  pintarAtencion();
  pintarPeriodo(7);
}
</script>
</body>
</html>
