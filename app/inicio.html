<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Inicio · The Carriers</title>
<link rel="icon" href="../assets/brand/mark-white.svg">
<link rel="stylesheet" href="../assets/app.css?v=7c62d7d6">
<script src="../assets/vigia.js?v=7c62d7d6" defer></script>
</head>
<body data-seccion="inicio">
<main class="contenido contenido--ancho">
  <div class="encabezado">
    <div>
      <h1>Inicio</h1>
      <p>Lo que necesita tu atención hoy. Los números vienen después: primero, qué hay que hacer.</p>
    </div>
    <div class="encabezado__acciones">
      <a class="boton boton--fantasma" href="pedidos.html">Ver pedidos</a>
    </div>
  </div>

  <section class="tarjeta">
    <div class="tarjeta__cabeza">
      <h2>Qué atender</h2>
      <span class="apagado" style="font-size:12px" id="pendientes"></span>
    </div>
    <div id="tareas"></div>
  </section>

  <h2 style="margin:28px 0 14px;font-size:15px">El periodo</h2>
  <div class="rejilla rejilla--4" id="metricas"></div>

  <div class="rejilla rejilla--2" style="margin-top:14px;align-items:start">
    <section class="tarjeta">
      <div class="tarjeta__cabeza"><h2>Últimos pedidos</h2>
        <a class="boton boton--sutil boton--chico" href="pedidos.html">Ver todos</a></div>
      <div class="tabla-caja scroll-fino">
        <table>
          <caption class="sr-only">Los pedidos más recientes.</caption>
          <thead><tr><th scope="col">Pedido</th><th scope="col">Cliente</th>
            <th scope="col">Total</th><th scope="col">Envío</th></tr></thead>
          <tbody id="ultimos"></tbody>
        </table>
      </div>
    </section>

    <section class="tarjeta">
      <div class="tarjeta__cabeza"><h2>Lo que tienes conectado</h2></div>
      <div class="tarjeta__cuerpo" style="display:grid;gap:11px" id="conexiones"></div>
    </section>
  </div>
</main>

<script type="module">
import { montar, exigirSesion } from "../assets/app.js?v=7c62d7d6";
import { pedidos, sinGuia, conGuia, conError, ingresos, tienda,
         dinero, dineroMXN, fechaCorta, diasDesde, detenidos } from "../assets/datos.js?v=7c62d7d6";
if (exigirSesion()) {
  montar();

  const ico = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

  /* Antigüedad: lo que cuesta dinero no es cuántos faltan, sino cuántos días
     llevan esperando. Pero "sin guía" agrupa tres problemas distintos y cada
     uno se resuelve de otra forma, así que no se cuentan juntos:
       - los que fallaron al generar la guía → hay que reintentar
       - los que nadie ha tocado            → hay que generarla
       - los que no están pagados           → no se envían todavía  */
  const esperando = sinGuia.filter((p) => !p.error && p.pago === "Pagado" && diasDesde(p.fecha) >= 3);
  const sinPagar = sinGuia.filter((p) => p.pago !== "Pagado");
  const masViejo = esperando.length ? Math.max(...esperando.map((p) => diasDesde(p.fecha))) : 0;

  const tareas = [
    conError.length && {
      tono: "urge",
      icono: '<path d="M12 4 21 19H3z"/><path d="M12 10v4M12 17h.01"/>',
      titulo: `${conError.length} pedido no pudo generar su guía`,
      texto: conError[0].error,
      accion: "Reintentar", href: "pedidos.html?vista=sin-enviar",
    },
    esperando.length && {
      tono: "urge",
      icono: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 1.5"/>',
      titulo: `${esperando.length} ${esperando.length === 1 ? "pedido pagado lleva" : "pedidos pagados llevan"} hasta ${masViejo} días sin guía`,
      texto: "Cada día que pasa es una pregunta del cliente que todavía no llega.",
      accion: "Generar guías", href: "pedidos.html?vista=sin-enviar",
    },
    sinPagar.length && {
      tono: "atender",
      icono: '<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/>',
      titulo: `${sinPagar.length} ${sinPagar.length === 1 ? "pedido sigue" : "pedidos siguen"} sin pagar`,
      texto: "No se les genera guía hasta que el pago entre. Aparecen bloqueados en la lista.",
      accion: "Ver cuáles", href: "pedidos.html?vista=sin-enviar",
    },
    detenidos.length && {
      tono: "atender",
      icono: '<path d="M3 5h18v14H3z"/><path d="M3 10h18M9 10v9"/>',
      titulo: `${detenidos.length} envíos detenidos en la paquetería`,
      texto: "El cliente se entera antes que tú si nadie los atiende.",
      accion: "Revisar", href: "excepciones.html",
    },
    {
      tono: "ok",
      icono: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/>',
      titulo: "Recolección de DHL confirmada para mañana",
      texto: "14 piezas, de 10:00 a 14:00.",
      accion: "Ver recolecciones", href: "recolecciones.html",
    },
  ].filter(Boolean);

  document.getElementById("pendientes").textContent =
    `${tareas.filter((t) => t.tono !== "ok").length} cosas pendientes`;

  document.getElementById("tareas").innerHTML = tareas.map((t) => `
    <div class="tarea tarea--${t.tono}">
      <span class="tarea__icono">${ico(t.icono)}</span>
      <div class="tarea__cuerpo"><b>${t.titulo}</b><p>${t.texto}</p></div>
      <a class="boton boton--${t.tono === "ok" ? "sutil" : "fantasma"} boton--chico" href="${t.href}">${t.accion}</a>
    </div>`).join("");

  const metrica = (e, v, n) =>
    `<div class="metrica"><p class="metrica__etiqueta">${e}</p>
     <p class="metrica__valor tabular">${v}</p><p class="metrica__nota">${n}</p></div>`;
  document.getElementById("metricas").innerHTML =
    metrica("Pedidos", pedidos.length, "Recibidos en el periodo") +
    metrica("Sin enviar", sinGuia.length, "Todavía sin guía generada") +
    metrica("Con guía", conGuia.length, "Ya en manos de la paquetería") +
    metrica("Ingresos", dineroMXN(ingresos), "Suma de los pedidos del periodo");

  document.getElementById("ultimos").innerHTML = pedidos.slice(0, 5).map((p) => `
    <tr data-href="pedidos.html">
      <td><a class="mono" href="pedidos.html">${p.folio}</a>
          <br><span class="apagado" style="font-size:12px">${fechaCorta(p.fecha)}</span></td>
      <td>${p.cliente.nombre}</td>
      <td class="tabular">${dinero(p.total)}</td>
      <td>${p.envio
        ? `<span class="pastilla pastilla--ok">${p.envio.paqueteria}</span>`
        : p.error
          ? '<span class="pastilla pastilla--mal">Error</span>'
          : '<span class="pastilla pastilla--aviso">Sin guía</span>'}</td>
    </tr>`).join("");

  document.getElementById("conexiones").innerHTML = `
    <div class="tarea" style="padding:12px 0;border:0">
      <span class="tarea__icono tarea__icono--ok" style="border-color:rgba(15,157,110,.4);background:rgba(15,157,110,.12);color:var(--accent-claro)">
        ${ico('<path d="M5 7h14l-1 13H6z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/>')}
      </span>
      <div class="tarea__cuerpo"><b>${tienda.canal}</b><p>${tienda.dominio}</p></div>
      <span class="pastilla pastilla--ok">Conectado</span>
    </div>
    <div class="tarea" style="padding:12px 0;border:0">
      <span class="tarea__icono">${ico('<path d="M12 3v18M3 12h18"/>')}</span>
      <div class="tarea__cuerpo"><b>Otro canal o paquetería</b>
        <p>Lo conectamos contigo durante el onboarding.</p></div>
      <a class="boton boton--sutil boton--chico" href="pendiente.html?p=Configuración">Conectar</a>
    </div>`;
}
</script>
</body>
</html>
