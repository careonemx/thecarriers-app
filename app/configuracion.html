<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Configuración · The Carriers</title>
<link rel="icon" href="../assets/brand/mark-white.svg">
<link rel="stylesheet" href="../assets/app.css?v=066fff98">
<script src="../assets/vigia.js?v=066fff98" defer></script>
</head>
<body data-seccion="ajustes">
<main class="contenido contenido--ancho">

  <div class="encabezado" style="margin-bottom:24px">
    <div>
      <h1>Configuración</h1>
      <p>Qué hace el sistema por su cuenta, sin que nadie entre a Pedidos.</p>
    </div>
  </div>

  <p class="guardado" id="guardado" role="status" aria-live="polite" hidden></p>

  <section class="zona">
    <h2 class="zona__titulo">Cuando entra un pedido pagado</h2>
    <div class="tarjeta">
      <div class="tarjeta__cuerpo campos" id="automatico"></div>
    </div>
  </section>

  <section class="zona zona--analitica">
    <h2 class="zona__titulo">Lo demás se ajusta en su pantalla</h2>
    <div class="fichas fichas--conexiones" id="atajos"></div>
  </section>

</main>

<script type="module">
import { montar, exigirSesion } from "../assets/app.js?v=066fff98";
import { origenes, plantillas } from "../assets/datos.js?v=066fff98";
if (exigirSesion()) {
  montar();

  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  const aviso = document.getElementById("guardado");
  let quitando;
  function avisar(texto) {
    clearTimeout(quitando);
    aviso.textContent = texto;
    aviso.hidden = false;
    quitando = setTimeout(() => { aviso.hidden = true; }, 3500);
  }

  /* ---------- Cuando entra un pedido pagado ----------
     Es el único ajuste que no pertenece a una cuenta concreta: describe la
     cadena que corre sola —revisar la dirección, pedir la guía, con qué
     remitente y con qué medidas—, y por eso se lee en orden.

     La validación de direcciones vive aquí y no en una lista de conexiones:
     es un paso de esa cadena, y aquí es donde se entiende para qué sirve. Su
     clave va plegada junto a ella. */
  document.getElementById("automatico").innerHTML = `
    <label class="marca-campo">
      <input type="checkbox" id="auto-validar" checked>
      <span>Revisar la dirección antes de pedir la guía
        <span class="apagado" style="display:block;font-size:12px">
          Si algo no coincide, el pedido pasa a Correcciones en lugar de generarse
          con una dirección incorrecta.</span></span>
    </label>

    <details class="avanzado avanzado--ficha avanzado--sangrado">
      <summary>Clave de validación</summary>
      <div class="campos">
        <label class="campo"><span>Clave</span>
          <input value="•••• guardada" readonly>
          <span class="campo__ayuda">La clave es tuya y el gasto se carga a tu cuenta.</span></label>
      </div>
    </details>

    <label class="marca-campo">
      <input type="checkbox" id="auto-guia">
      <span>Generar la guía automáticamente
        <span class="apagado" style="display:block;font-size:12px">
          En cuanto el pedido se marque como pagado, sin que nadie entre a Pedidos.
          La paquetería sale de tu orden de preferencia.</span></span>
    </label>

    <div class="campos campos--2">
      <label class="campo"><span>Sale de</span>
        <select id="auto-origen">
          ${origenes.map((o) => `<option${o.predeterminado ? " selected" : ""}>${esc(o.nombre)}</option>`).join("")}
        </select>
        <span class="campo__ayuda">La dirección que va como remitente.</span>
      </label>
      <label class="campo"><span>Con la plantilla</span>
        <select id="auto-plantilla">
          ${plantillas.map((p) => `<option${p.predeterminada ? " selected" : ""}>${esc(p.nombre)}</option>`).join("")}
        </select>
        <span class="campo__ayuda">Peso y medidas cuando el pedido no los incluye.</span>
      </label>
    </div>`;

  document.getElementById("auto-guia").addEventListener("change", (e) =>
    avisar(e.target.checked
      ? "Guardado. Las guías se generarán automáticamente al marcarse el pago."
      : "Guardado. Las guías se generan manualmente desde Pedidos."));

  document.getElementById("auto-validar").addEventListener("change", (e) =>
    avisar(e.target.checked
      ? "Guardado. Cada dirección se revisa antes de pedir la guía."
      : "Guardado. Las direcciones ya no se revisan."));

  /* Cada ajuste vive en la pantalla del objeto que ajusta. Estas tarjetas no
     duplican nada: dicen dónde está cada cosa para quien llegue aquí buscando
     lo que antes estaba junto. */
  const ATAJOS = [
    { nombre: "Canales de venta", href: "canales.html",
      que: "Por dónde entran los pedidos." },
    { nombre: "Paqueterías", href: "paqueterias.html",
      que: "Por dónde salen y con qué criterio se elige una u otra." },
    { nombre: "Direcciones de Origen", href: "origenes.html",
      que: "De dónde salen los paquetes y dónde los recogen." },
    { nombre: "Plantillas", href: "plantillas.html",
      que: "Peso y medidas de las cajas que usas." },
  ];

  document.getElementById("atajos").innerHTML = ATAJOS.map((a) => `
    <a class="ficha ficha--enlace" href="${a.href}">
      <div class="ficha__cabeza"><div><h2>${esc(a.nombre)}</h2></div>
        <span class="ficha__ir" aria-hidden="true">&rarr;</span></div>
      <p class="ficha__nota">${esc(a.que)}</p>
    </a>`).join("");
}
</script>
</body>
</html>
