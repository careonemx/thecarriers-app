<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Direcciones de Origen · The Carriers</title>
<link rel="icon" href="../assets/brand/mark-white.svg">
<link rel="stylesheet" href="../assets/app.css?v=88b4f520">
<script src="../assets/vigia.js?v=88b4f520" defer></script>
</head>
<body data-seccion="origenes">
<main class="contenido contenido--ancho">

  <div class="encabezado" style="margin-bottom:24px">
    <div>
      <h1>Direcciones de Origen</h1>
      <p>De aquí salen tus pedidos y aquí llega la paquetería a recogerlos.</p>
    </div>
    <div class="encabezado__acciones" id="acciones">
      <button class="boton boton--primario" type="button" data-nuevo>Agregar dirección</button>
    </div>
  </div>

  <div class="fichas-barra" id="barra" hidden>
    <div class="campo-buscar" style="flex:1;max-width:420px">
      <div class="buscador">
        <label class="sr-only" for="buscar-origen">Buscar una dirección</label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="buscar-origen" autocomplete="off"
               placeholder="Buscar por nombre, calle, colonia o CP">
      </div>
    </div>
    <span class="fichas-barra__sep"></span>
    <span class="apagado" style="font-size:12px" id="cuenta-origen"></span>
    <div class="conmutador" role="group" aria-label="Forma de ver la lista">
      <button type="button" data-modo="tarjetas" aria-pressed="true">Tarjetas</button>
      <button type="button" data-modo="lista" aria-pressed="false">Lista</button>
    </div>
  </div>

  <p class="guardado" id="guardado" role="status" aria-live="polite" hidden></p>

  <div id="vista"></div>

  <dialog class="panel" id="panel" aria-labelledby="panel-titulo"></dialog>
  <dialog class="dialogo" id="confirmar" aria-labelledby="confirmar-titulo"></dialog>
</main>

<script type="module">
import { montar, exigirSesion } from "../assets/app.js?v=88b4f520";
import { origenes, origenPredeterminado, recolecciones, recoleccionesHoy,
         coloniasPorCP, telefonoMX, ladas, fechaCorta, HOY } from "../assets/datos.js?v=88b4f520";
if (exigirSesion()) {
  montar();

  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;

  const panel = document.getElementById("panel");

  /* La dirección en una línea, como se lee en una etiqueta. */
  const enUnaLinea = (c) => [
    [c.calle, c.numExt].filter(Boolean).join(" ") + (c.numInt ? ` Int. ${c.numInt}` : ""),
    c.colonia,
    `${c.ciudad}, ${c.estado}`,
    `CP ${c.cp}`,
  ].filter(Boolean);

  /* Lo que de verdad importa de una dirección de origen no es la calle: es si
     alguien va a pasar por ahí y a qué hora. Eso sale de las recolecciones
     ya programadas, no de un texto fijo. */
  const agenda = (o) => {
    const suyas = recolecciones.filter((r) => r.origen === o.id && r.fecha >= HOY)
      .sort((a, b) => a.fecha.localeCompare(b.fecha));
    const hoy = suyas.filter((r) => r.fecha === HOY);
    if (hoy.length) {
      return { tono: "ok", corto: `${hoy.length} hoy`,
               detalle: hoy.map((r) => `${r.paqueteria} ${r.ventana}`).join(" · ") };
    }
    if (suyas.length) {
      const p = suyas[0];
      return { tono: "neutra", corto: fechaCorta(p.fecha),
               detalle: `${p.paqueteria} ${p.ventana} · ${plural(p.piezas, "pieza", "piezas")}` };
    }
    return { tono: "aviso", corto: "Sin programar", detalle: "" };
  };

  function tarjeta(o) {
    const c = o.campos;
    const a = agenda(o);
    return `
      <article class="ficha${o.predeterminado ? " ficha--principal" : ""}" data-id="${esc(o.id)}">
        <div class="ficha__cabeza">
          <div>
            <h2>${esc(o.nombre)}</h2>
            <p class="ficha__sub">${esc(c.nombre)} ${esc(c.apellido)} <span class="ficha__nowrap">· ${esc(telefonoMX(c.telefono))}</span></p>
          </div>
          ${o.predeterminado
            ? '<span class="pastilla pastilla--ok" title="Es el remitente que se imprime en cada etiqueta">Predeterminado</span>'
            : ""}
        </div>
        ${o.predeterminado
          ? '<p class="ficha__nota">Es el remitente que se imprime en cada etiqueta.</p>'
          : ""}

        <address class="ficha__cuerpo">${enUnaLinea(c).map(esc).join("<br>")}</address>

        <dl class="ficha__datos">
          <div><dt>Entrega a la paquetería</dt><dd>${esc(o.horario.abre)} a ${esc(o.horario.cierra)}</dd></div>
          <div><dt>Recolección</dt><dd><span class="pastilla pastilla--${a.tono}">${esc(a.corto)}</span></dd></div>
        </dl>
        ${a.detalle ? `<p class="ficha__nota">${esc(a.detalle)}</p>` : ""}

        <div class="ficha__pie">
          <button class="boton boton--fantasma boton--chico" type="button" data-editar>Editar dirección</button>
          ${o.predeterminado ? "" : '<button class="boton boton--sutil boton--chico" type="button" data-predeterminar>Hacer predeterminado</button>'}
          <span class="ficha__pie-sep"></span>
          <button class="boton boton--sutil boton--chico" type="button" data-borrar
            ${o.predeterminado ? 'disabled title="El predeterminado no se puede eliminar: primero nombra otro."' : ""}>
            Eliminar
          </button>
        </div>
      </article>`;
  }

  /* ---------- Cuántas hay cambia cómo se ven ----------

     Con dos o tres direcciones, las tarjetas ganan: caben los datos que
     importan —horario, si alguien va a pasar— y se leen de un vistazo.

     Con veinte, esa misma tarjeta es un muro de cuatro mil píxeles y
     encontrar una concreta obliga a recorrerlo entero. Ahí manda la lista:
     una fila por dirección, densa y ordenable con la vista.

     El modo arranca según cuántas hay y a partir de ahí lo decide quien
     opera, porque su bodega la conoce mejor que un umbral. */
  const UMBRAL_LISTA = 6;
  const CLAVE_MODO = "tc:origenes-modo";

  let modo = (() => {
    try { return localStorage.getItem(CLAVE_MODO) || (origenes.length > UMBRAL_LISTA ? "lista" : "tarjetas"); }
    catch { return origenes.length > UMBRAL_LISTA ? "lista" : "tarjetas"; }
  })();
  let busca = "";
  let pagina = 1;
  let porPagina = 10;

  const barra = document.getElementById("barra");
  const vista = document.getElementById("vista");
  const entrada = document.getElementById("buscar-origen");

  const sinAcentos = (t) => String(t).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  /* Se busca por lo que alguien recuerda de una dirección: cómo la llamó, la
     calle, la colonia, la ciudad o el código postal. Y sin acentos, porque
     nadie los teclea en un buscador. */
  const coincide = (o) => {
    if (!busca) return true;
    const c = o.campos;
    return sinAcentos([o.nombre, c.nombre, c.apellido, c.calle, c.numExt,
                       c.colonia, c.ciudad, c.estado, c.cp].join(" ")).includes(busca);
  };

  function filaLista(o) {
    const c = o.campos;
    const a = agenda(o);
    return `
      <tr data-id="${esc(o.id)}"${o.predeterminado ? ' class="fila--principal"' : ""}>
        <td>
          <label class="marca-campo" title="Usar como remitente predeterminado">
            <input type="radio" name="predeterminado" ${o.predeterminado ? "checked" : ""}
              aria-label="Hacer predeterminada ${esc(o.nombre)}" data-predeterminar>
          </label>
        </td>
        <td>
          <b>${esc(o.nombre)}</b>
          ${o.predeterminado ? ' <span class="pastilla pastilla--ok">Predeterminado</span>' : ""}
          <div class="apagado" style="margin-top:3px;font-size:12px">
            ${esc([c.calle, c.numExt].filter(Boolean).join(" "))}${c.numInt ? ` Int. ${esc(c.numInt)}` : ""},
            ${esc(c.colonia)} · ${esc(c.ciudad)}, ${esc(c.estado)} ${esc(c.cp)}
          </div>
        </td>
        <td>${esc(c.nombre)} ${esc(c.apellido)}
          <div class="apagado" style="margin-top:3px;font-size:12px">${esc(telefonoMX(c.telefono))}</div></td>
        <td class="tabular">${esc(o.horario.abre)} – ${esc(o.horario.cierra)}</td>
        <td><span class="pastilla pastilla--${a.tono}">${esc(a.corto)}</span></td>
        <td>
          <div class="grupo-botones" style="gap:6px;flex-wrap:nowrap;justify-content:flex-end">
            <button class="boton boton--fantasma boton--chico" type="button" data-editar>Editar</button>
            <button class="boton boton--sutil boton--chico" type="button" data-borrar
              ${o.predeterminado ? 'disabled title="El predeterminado no se puede eliminar: primero nombra otro."' : ""}>Eliminar</button>
          </div>
        </td>
      </tr>`;
  }

  const listaHTML = (items) => `
    <section class="tarjeta">
      <div class="tabla-caja scroll-fino">
        <table>
          <caption class="sr-only">Direcciones de origen registradas.</caption>
          <thead><tr>
            <th scope="col" style="width:40px"><span class="sr-only">Predeterminado</span></th>
            <th scope="col">Dirección</th><th scope="col">Contacto</th>
            <th scope="col">Entrega</th><th scope="col">Recolección</th>
            <th scope="col"><span class="sr-only">Acciones</span></th>
          </tr></thead>
          <tbody>${items.map(filaLista).join("")}</tbody>
        </table>
      </div>
    </section>`;

  const tarjetasHTML = (items) => `
    <div class="fichas">
      ${items.map(tarjeta).join("")}
    </div>`;

  /* Sin ninguna dirección no hay de dónde salir: no se puede cotizar, ni
     generar una guía, ni programar una recolección. El vacío lo dice, en vez
     de dejar una cuadrícula con un solo recuadro punteado. */
  const vacioHTML = () => `
    <div class="vacio">
      <h3>Todavía no hay ninguna dirección de origen</h3>
      <p>Es la dirección que se imprime como remitente en cada etiqueta y a la
         que llega la paquetería a recoger. Sin al menos una, no se puede
         cotizar ni generar guías.</p>
      <div class="vacio__acciones">
        <button class="boton boton--primario" type="button" data-nuevo>
          Agregar la primera dirección</button>
      </div>
    </div>`;

  const sinResultadosHTML = () => `
    <div class="vacio">
      <h3>Ninguna dirección coincide con “${esc(busca)}”</h3>
      <p>Se busca por nombre, calle, colonia, ciudad o código postal.</p>
      <div class="vacio__acciones">
        <button class="boton boton--sutil" type="button" data-limpiar-busqueda>Quitar la búsqueda</button>
      </div>
    </div>`;

  const pieHTML = (total, ini, mostrados, paginas) => `
    <div class="tarjeta__pie">
      <span>${total
        ? `Mostrando <b>${ini + 1}–${ini + mostrados}</b> de <b>${total}</b>`
        : "Ninguna dirección"}</span>
      <label class="filtros__etiqueta" for="por-pagina-origenes">
        <select id="por-pagina-origenes" style="width:auto;margin-left:8px">
          ${[10, 25, 50].map((n) =>
            `<option value="${n}"${n === porPagina ? " selected" : ""}>${n} por página</option>`).join("")}
        </select>
      </label>
      <span class="filtros__sep"></span>
      <div class="paginacion"${paginas === 1 ? " hidden" : ""}>
        <button type="button" data-ir="${pagina - 1}"${pagina === 1 ? " disabled" : ""}>‹</button>
        ${Array.from({ length: paginas }, (_, i) => i + 1).map((n) =>
          `<button type="button" data-ir="${n}"${n === pagina ? ' aria-current="page"' : ""}>${n}</button>`).join("")}
        <button type="button" data-ir="${pagina + 1}"${pagina === paginas ? " disabled" : ""}>›</button>
      </div>
    </div>`;

  function pintar() {
    /* La barra solo aparece cuando sirve de algo: buscar entre tres
       direcciones es más lento que mirarlas. */
    const muchas = origenes.length > UMBRAL_LISTA;
    const vacia = origenes.length === 0;
    barra.hidden = vacia;
    document.getElementById("acciones").hidden = vacia;
    barra.querySelector(".campo-buscar").hidden = !muchas;
    barra.querySelectorAll("[data-modo]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.modo === modo)));

    if (origenes.length === 0) { vista.innerHTML = vacioHTML(); return; }

    const items = origenes.filter(coincide);
    document.getElementById("cuenta-origen").textContent = busca
      ? `${items.length} de ${origenes.length}`
      : `${items.length} ${items.length === 1 ? "dirección" : "direcciones"}`;

    if (items.length === 0) { vista.innerHTML = sinResultadosHTML(); return; }

    const paginas = Math.max(1, Math.ceil(items.length / porPagina));
    pagina = Math.min(pagina, paginas);
    const ini = (pagina - 1) * porPagina;
    const enPagina = items.slice(ini, ini + porPagina);

    const cuerpo = modo === "lista" ? listaHTML(enPagina) : tarjetasHTML(enPagina);
    const pie = pieHTML(items.length, ini, enPagina.length, paginas);
    /* En lista el pie va DENTRO de la tarjeta, como en Pedidos. En cuadrícula
       no hay tarjeta que lo contenga, así que va en la suya. */
    vista.innerHTML = modo === "lista"
      ? cuerpo.replace("</section>", `${pie}</section>`)
      : `${cuerpo}<section class="tarjeta tarjeta--solo-pie">${pie}</section>`;
  }

  vista.addEventListener("change", (e) => {
    if (!e.target.matches("#por-pagina-origenes")) return;
    porPagina = +e.target.value;
    pagina = 1;
    pintar();
  });

  entrada.addEventListener("input", () => {
    busca = sinAcentos(entrada.value.trim());
    pagina = 1;
    pintar();
  });

  barra.addEventListener("click", (e) => {
    const b = e.target.closest("[data-modo]");
    if (!b || b.dataset.modo === modo) return;
    modo = b.dataset.modo;
    try { localStorage.setItem(CLAVE_MODO, modo); } catch { /* modo privado */ }
    pintar();
  });

  /* ---------- El formulario ----------
     Son los MISMOS campos, con las mismas etiquetas, que al editar la
     dirección de un pedido. Una dirección es una dirección: dos formularios
     distintos para lo mismo terminan validando distinto. */
  const campo = (id, etiqueta, valor, extra = "", ayuda = "") => `
    <label class="campo" data-campo="${id}">
      <span>${etiqueta}</span>
      <input id="org-${id}" name="${id}" value="${esc(valor ?? "")}" ${extra}>
      ${ayuda ? `<span class="campo__ayuda">${ayuda}</span>` : ""}
      <span class="campo__error" hidden></span>
    </label>`;

  function formulario(o) {
    const c = o.campos;
    return `
      <form id="form-origen" novalidate class="campos">
        ${campo("nombre-ficha", "Nombre de esta dirección", o.nombre,
                'required placeholder="Almacén Puebla"',
                "Solo para reconocerlo aquí. No va en la etiqueta.")}

        <p class="campos__titulo">Contacto</p>

        <div class="campos campos--2">
          ${campo("nombre", "Nombre de contacto", c.nombre, 'autocomplete="given-name" required')}
          ${campo("apellido", "Apellido de contacto", c.apellido, 'autocomplete="family-name" required')}
        </div>

        ${campo("correo", "Correo electrónico", c.correo, 'type="email" autocomplete="email" placeholder="nombre@ejemplo.com"')}

        <div class="campos campos--2">
          <label class="campo" data-campo="telefono">
            <span>Número de contacto</span>
            <span class="campo-tel">
              <label class="sr-only" for="org-lada">Código de país</label>
              <select id="org-lada" name="lada">
                ${ladas.map((l) => `<option value="${l.codigo}"${l.codigo === (c.lada ?? "+52") ? " selected" : ""}>${l.bandera} ${l.codigo}</option>`).join("")}
              </select>
              <input id="org-telefono" name="telefono" value="${esc(c.telefono ?? "")}"
                     inputmode="tel" maxlength="10" placeholder="55 1234 5678" autocomplete="tel-national">
            </span>
            <span class="campo__error" hidden></span>
          </label>
          ${campo("compania", "Compañía (opcional)", c.compania, 'placeholder="Mi empresa"')}
        </div>

        <p class="campos__titulo">Dirección</p>

        ${campo("calle", "Calle", c.calle, 'autocomplete="address-line1" required placeholder="Av. Reforma"')}

        <div class="campos campos--2">
          ${campo("numExt", "Número exterior", c.numExt, 'required placeholder="123"')}
          ${campo("numInt", "Número interior (opcional)", c.numInt, 'placeholder="Bodega 4"')}
        </div>

        <div class="campos campos--corto-largo">
          ${campo("cp", "Código postal", c.cp, 'inputmode="numeric" maxlength="5" autocomplete="postal-code" required')}
          <label class="campo" data-campo="colonia">
            <span>Colonia</span>
            <input id="org-colonia" name="colonia" list="org-colonias" value="${esc(c.colonia ?? "")}" required>
            <datalist id="org-colonias"></datalist>
            <span class="campo__error" hidden></span>
          </label>
        </div>

        <p class="campos__ayuda">El código postal define la colonia, la ciudad y el estado.</p>

        <div class="campos campos--2">
          ${campo("estado", "Estado", c.estado, "required")}
          ${campo("ciudad", "Ciudad o municipio", c.ciudad, "required")}
        </div>

        <label class="campo" data-campo="referencia">
          <span>Referencia</span>
          <textarea id="org-referencia" name="referencia" rows="2" maxlength="100"
            placeholder="Portón blanco de reja, frente a la gasolinera.">${esc(c.referencia ?? "")}</textarea>
          <span class="campo__pie">
            <span class="campo__ayuda">Ayuda al repartidor a encontrar el domicilio.</span>
            <span class="campo__contador" id="org-contador">0/100</span>
          </span>
        </label>

        <p class="campos__titulo">Cuándo hay quién entregue</p>

        <div class="campos campos--2">
          <label class="campo" data-campo="abre"><span>Abre</span>
            <input id="org-abre" name="abre" type="time" value="${esc(o.horario.abre)}" required>
            <span class="campo__error" hidden></span></label>
          <label class="campo" data-campo="cierra"><span>Cierra</span>
            <input id="org-cierra" name="cierra" type="time" value="${esc(o.horario.cierra)}" required>
            <span class="campo__error" hidden></span></label>
        </div>
        <p class="campos__ayuda">La recolección solo se puede programar dentro de esta ventana.</p>
      </form>`;
  }

  let editando = null;

  function abrir(o) {
    editando = o;
    panel.innerHTML = `
      <div class="panel__cabeza">
        <div><h2 id="panel-titulo">${o.id ? "Editar dirección de origen" : "Nueva dirección de origen"}</h2>
          <p class="apagado" style="font-size:12px;margin-top:3px">
            Esta dirección se imprime como remitente en cada etiqueta.</p></div>
        <button class="panel__cerrar" type="button" aria-label="Cerrar" data-cerrar-panel>✕</button>
      </div>
      <div class="panel__cuerpo scroll-fino">${formulario(o)}</div>
      <div class="panel__pie">
        <button class="boton boton--sutil" type="button" data-cerrar-panel>Cancelar</button>
        <button class="boton boton--primario" type="button" data-guardar>Guardar</button>
      </div>`;
    conectarFormulario();
    panel.showModal();
  }

  /* El código postal manda: define colonia, ciudad y estado. Escribirlos a
     mano es la forma más común de que no coincidan entre sí. */
  function conectarFormulario() {
    const cp = panel.querySelector("#org-cp");
    const colonia = panel.querySelector("#org-colonia");
    const lista = panel.querySelector("#org-colonias");
    const estado = panel.querySelector("#org-estado");
    const ciudad = panel.querySelector("#org-ciudad");

    const porCP = () => {
      const d = coloniasPorCP[cp.value.trim()];
      lista.innerHTML = d ? d.colonias.map((x) => `<option value="${esc(x)}">`).join("") : "";
      if (!d) return;
      estado.value = d.estado;
      ciudad.value = d.ciudad;
      if (!d.colonias.includes(colonia.value)) colonia.value = d.colonias[0];
    };
    cp.addEventListener("input", porCP);
    porCP();

    const ref = panel.querySelector("#org-referencia");
    const cont = panel.querySelector("#org-contador");
    const contar = () => { cont.textContent = `${ref.value.length}/100`; };
    ref.addEventListener("input", contar);
    contar();
  }

  function guardar() {
    const f = panel.querySelector("#form-origen");
    const v = (n) => f.querySelector(`[name="${n}"]`).value.trim();

    let falla = null;
    for (const [n, etiqueta] of [["nombre-ficha", "el nombre del punto"], ["nombre", "el nombre"],
      ["apellido", "el apellido"], ["calle", "la calle"], ["numExt", "el número exterior"],
      ["cp", "el código postal"], ["colonia", "la colonia"], ["estado", "el estado"], ["ciudad", "la ciudad"]]) {
      const campo = f.querySelector(`[data-campo="${n}"]`);
      const error = campo?.querySelector(".campo__error");
      const vacio = !v(n);
      if (error) { error.textContent = vacio ? `Falta ${etiqueta}.` : ""; error.hidden = !vacio; }
      campo?.querySelector("input")?.setAttribute("aria-invalid", String(vacio));
      if (vacio && !falla) falla = campo;
    }
    if (v("abre") >= v("cierra")) {
      const campo = f.querySelector('[data-campo="cierra"]');
      const error = campo.querySelector(".campo__error");
      error.textContent = "La hora de cierre tiene que ser posterior a la de apertura.";
      error.hidden = false;
      falla = falla || campo;
    }
    if (falla) { falla.querySelector("input, select, textarea")?.focus(); return; }

    const destino = editando.id ? origenes.find((o) => o.id === editando.id) : null;
    const datos = {
      nombre: v("nombre-ficha"),
      horario: { abre: v("abre"), cierra: v("cierra") },
      campos: {
        nombre: v("nombre"), apellido: v("apellido"), correo: v("correo"),
        lada: v("lada"), telefono: v("telefono"), compania: v("compania"),
        calle: v("calle"), numExt: v("numExt"), numInt: v("numInt"),
        cp: v("cp"), colonia: v("colonia"), estado: v("estado"), ciudad: v("ciudad"),
        referencia: v("referencia"),
      },
    };

    if (destino) Object.assign(destino, datos);
    else origenes.push({ id: `p${Date.now()}`, predeterminado: origenes.length === 0, ...datos });

    panel.close();
    pintar();
  }

  const vacio = () => ({
    id: null, nombre: "", predeterminado: false,
    horario: { abre: "09:00", cierra: "18:00" },
    campos: { nombre: "", apellido: "", correo: "", lada: "+52", telefono: "", compania: "",
              calle: "", numExt: "", numInt: "", cp: "", colonia: "", estado: "", ciudad: "", referencia: "" },
  });

  vista.addEventListener("click", (e) => {
    if (e.target.closest("[data-nuevo]")) return abrir(vacio());
    if (e.target.closest("[data-limpiar-busqueda]")) {
      entrada.value = ""; busca = ""; pintar(); entrada.focus();
      return;
    }

    const ir = e.target.closest("[data-ir]");
    if (ir && !ir.disabled) { pagina = +ir.dataset.ir; pintar(); return; }

    const fila = e.target.closest("[data-id]");
    if (!fila) return;
    const o = origenes.find((x) => x.id === fila.dataset.id);
    if (!o) return;

    if (e.target.closest("[data-editar]")) return abrir(o);
    if (e.target.closest("[data-borrar]")) return pedirConfirmacion(o);
  });

  /* El predeterminado es uno de muchos, que es exactamente lo que un radio
     dice por su cuenta: elegir uno desmarca el resto. Va por `change` y no
     por `click` para que también funcione con el teclado. */
  vista.addEventListener("change", (e) => {
    if (!e.target.matches("[data-predeterminar]")) return;
    hacerPredeterminado(origenes.find((x) => x.id === e.target.closest("[data-id]").dataset.id));
  });

  /* En tarjetas el predeterminado se cambia con un botón, no con un radio:
     no hay una columna donde alinearlos y el botón dice el verbo. */
  vista.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-predeterminar]");
    if (!b) return;
    hacerPredeterminado(origenes.find((x) => x.id === b.closest("[data-id]").dataset.id));
  });

  /* No hay botón de "Guardar" para esto: se aplica al pulsarlo, como cualquier
     ajuste de una sola opción. Faltaba decirlo —una marca que se mueve sin más
     deja la duda de si quedó guardado—. */
  const aviso = document.getElementById("guardado");
  let quitando;

  function hacerPredeterminado(o) {
    if (!o || o.predeterminado) return;
    origenes.forEach((x) => { x.predeterminado = x === o; });
    pintar();
    clearTimeout(quitando);
    aviso.textContent = `Guardado. “${o.nombre}” es ahora la dirección predeterminada: se imprimirá como remitente en las etiquetas nuevas.`;
    aviso.hidden = false;
    quitando = setTimeout(() => { aviso.hidden = true; }, 4000);
  }

  /* Borrar una dirección de origen con recolecciones programadas deja a un camión
     yendo a una dirección que ya no existe. El diálogo lo dice antes, con el
     número exacto, y la acción destructiva se nombra: "Sí, eliminar". */
  const confirmar = document.getElementById("confirmar");

  function pedirConfirmacion(o) {
    const pendientes = recolecciones.filter((r) => r.origen === o.id && r.fecha >= HOY);
    confirmar.innerHTML = `
      <div class="dialogo__cabeza"><h2 id="confirmar-titulo">¿Eliminar ${esc(o.nombre)}?</h2></div>
      <div class="dialogo__cuerpo">
        ${pendientes.length
          ? `<p class="aviso aviso--alerta">Tiene ${plural(pendientes.length, "recolección programada", "recolecciones programadas")}:
               ${pendientes.map((r) => `${esc(r.paqueteria)} el ${esc(fechaCorta(r.fecha))}`).join(", ")}.
               Habrá que programarlas otra vez desde otra dirección.</p>`
          : "<p>No tiene recolecciones programadas.</p>"}
        <p style="margin-top:10px;color:var(--muted);font-size:13px">
          Las guías ya generadas conservan esta dirección como remitente: la etiqueta impresa no cambia.
        </p>
      </div>
      <div class="dialogo__pie">
        <button class="boton boton--sutil" type="button" data-no>Conservarlo</button>
        <button class="boton boton--peligro" type="button" data-si>Sí, eliminar</button>
      </div>`;
    confirmar.showModal();

    confirmar.onclick = (ev) => {
      if (ev.target === confirmar || ev.target.closest("[data-no]")) return confirmar.close();
      if (!ev.target.closest("[data-si]")) return;
      origenes.splice(origenes.indexOf(o), 1);
      if (!origenes.some((x) => x.predeterminado) && origenes[0]) origenes[0].predeterminado = true;
      confirmar.close();
      pintar();
    };
  }

  panel.addEventListener("click", (e) => {
    if (e.target.closest("[data-cerrar-panel]")) return panel.close();
    if (e.target.closest("[data-guardar]")) return guardar();
    if (e.target === panel) panel.close();
  });

  /* Gancho de prototipo: ?muchos=20 genera direcciones en memoria para poder
     ver y discutir cómo se comporta la pantalla con muchas. No se guarda
     nada y basta recargar sin el parámetro para volver a lo de siempre. */
  const muchos = +(new URLSearchParams(location.search).get("muchos") || 0);
  if (muchos > 0) {
    const ciudades = [["Monterrey", "Nuevo León", "64000"], ["Guadalajara", "Jalisco", "44160"],
      ["Querétaro", "Querétaro", "76040"], ["Mérida", "Yucatán", "97050"],
      ["Tijuana", "Baja California", "22014"], ["León", "Guanajuato", "37160"]];
    for (let i = 0; i < muchos; i++) {
      const [ciudad, estado, cp] = ciudades[i % ciudades.length];
      origenes.push({
        id: `demo${i}`, nombre: `Bodega ${ciudad} ${Math.floor(i / ciudades.length) + 1}`,
        predeterminado: false, horario: { abre: "09:00", cierra: "18:00" },
        campos: { nombre: "Contacto", apellido: `${i + 1}`, correo: "", lada: "+52",
          telefono: String(5500000000 + i), compania: "Distribuidora Monarca",
          calle: "Av. Principal", numExt: String(100 + i * 7), numInt: "",
          cp, colonia: "Centro", estado, ciudad, referencia: "" },
      });
    }
    modo = "lista";
  }

  pintar();
}
</script>
</body>
</html>
